<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parade to Zero</title>
<meta name="description" content="You're in the middle of a parade marching toward a giant clock that counts down to 9 November 2027.">
<meta name="theme-color" content="#1A1150">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1A1150;
    --magenta: #E63B8A;
    --marigold: #FFB31A;
    --teal: #12B5A6;
    --paper: #FFF4E0;
    --ink: #1A1150;
    --display: "Big Shoulders Display", "Impact", sans-serif;
    --text: "Bricolage Grotesque", system-ui, sans-serif;
  }
  /* The scene is a night parade in every colour scheme, so dark mode keeps the same tokens. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #1A1150; } }
  :root[data-theme="dark"] { --night: #1A1150; }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--night);
    color: var(--paper);
    font-family: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Route progress, top left */
  .route {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px;
    width: min(260px, calc(100vw - 32px));
    text-shadow: 0 1px 2px rgba(26, 17, 80, .9), 0 0 12px rgba(26, 17, 80, .7);
  }
  .route p { margin: 0 0 8px; font-size: 15px; line-height: 1.35; font-weight: 700; letter-spacing: .005em; }
  .route .sub { font-weight: 500; font-size: 13px; opacity: .82; margin-top: -4px; }
  .track { position: relative; height: 4px; border-radius: 2px; background: rgba(255, 244, 224, .22); }
  .track .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--teal), var(--marigold), var(--magenta)); }
  .track .goal { position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--paper); box-shadow: 0 0 0 3px var(--magenta); }

  /* Controls */
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    width: calc(100vw - 32px);
  }
  button {
    font: 800 16px/1 var(--text);
    min-height: 48px; padding: 0 22px; border-radius: 999px; cursor: pointer;
    border: 2px solid transparent; letter-spacing: .01em;
    transition: transform .12s ease, background-color .2s ease;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .primary { background: var(--marigold); color: var(--ink); box-shadow: 0 6px 0 #B9740A, 0 10px 24px rgba(0,0,0,.35); }
  .primary:hover { background: #FFC447; }
  .primary:active { box-shadow: 0 2px 0 #B9740A; transform: translateY(4px); }
  .ghost { background: rgba(26, 17, 80, .55); color: var(--paper); border-color: rgba(255, 244, 224, .55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ghost:hover { border-color: var(--paper); }
  .ghost[aria-pressed="true"] { border-color: var(--teal); }
  [hidden] { display: none !important; }

  /* Finale headline */
  .finale-text {
    position: fixed; left: 0; right: 0; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 76px);
    text-align: center; padding: 0 16px; pointer-events: none;
  }
  .finale-text h2 {
    margin: 0; font: 900 clamp(46px, 9.5vw, 132px)/.9 var(--display); letter-spacing: .01em;
    color: var(--paper); text-transform: none;
    text-shadow: 3px 3px 0 var(--magenta), 6px 6px 0 var(--teal), 0 0 40px rgba(255, 179, 26, .6);
  }
  .finale-text p { margin: 14px 0 0; font: 700 clamp(16px, 2.2vw, 22px)/1.3 var(--text);
    text-shadow: 0 1px 3px rgba(26,17,80,.9); }
  .finale-text.show h2 { animation: pop 900ms cubic-bezier(.2, 1.6, .4, 1) both; }
  .finale-text.show p { animation: rise 700ms 400ms ease-out both; }
  @keyframes pop { from { transform: scale(.3) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .finale-text.show h2, .finale-text.show p { animation: none; }
    button { transition: none; }
  }
  @media (max-width: 520px) {
    .route p { font-size: 14px; }
    button { font-size: 15px; padding: 0 18px; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">Countdown to 9 November 2027</h1>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="route">
    <p id="routeText">Day 1 of 365 on the parade route</p>
    <p class="sub" id="routeSub">The clock is getting closer every day.</p>
    <div class="track" aria-hidden="true"><span class="fill" id="routeFill"></span><span class="goal"></span></div>
  </div>

  <div class="finale-text" id="finaleText" hidden>
    <h2>It’s 9 November 2027</h2>
    <p id="finaleSub">The parade made it to the clock.</p>
  </div>

  <div class="controls">
    <button class="primary" id="finaleBtn" type="button">Skip to the finale</button>
    <button class="ghost" id="replayBtn" type="button" hidden>Watch again</button>
    <button class="ghost" id="soundBtn" type="button" aria-pressed="false">Turn sound on</button>
  </div>

  <p class="sr-only" id="live" aria-live="polite"></p>
  <noscript><p style="position:fixed;inset:auto 16px 16px;font:700 18px system-ui">This countdown needs JavaScript to run.</p></noscript>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------------
     Time
     --------------------------------------------------------------- */
  const TARGET = new Date(2027, 10, 9, 0, 0, 0).getTime();   // 9 Nov 2027, local midnight
  const START  = new Date(2026, 10, 9, 0, 0, 0).getTime();   // parade sets off a year earlier
  const TOTAL_DAYS = Math.round((TARGET - START) / 864e5);

  // Optional test hook: ?at=2027-11-08T23:59:50 pretends it is that moment.
  let offset = 0;
  const at = new URLSearchParams(location.search).get('at');
  if (at && !isNaN(Date.parse(at))) offset = Date.parse(at) - Date.now();
  const realNow = () => Date.now() + offset;

  function addMonths(d, n) {
    const r = new Date(d.getTime()), day = r.getDate();
    r.setDate(1); r.setMonth(r.getMonth() + n);
    const dim = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
    r.setDate(Math.min(day, dim));
    return r;
  }
  function addDays(d, n) { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; }

  // Calendar-correct months and days, then hours/minutes/seconds.
  function breakdown(nowMs) {
    const rem = TARGET - nowMs;
    if (rem <= 0) return { mo: 0, d: 0, h: 0, m: 0, s: 0, rem: 0 };
    const from = new Date(nowMs);
    let mo = (2027 - from.getFullYear()) * 12 + (10 - from.getMonth());
    while (mo > 0 && addMonths(from, mo).getTime() > TARGET) mo--;
    let anchor = addMonths(from, mo), d = 0;
    while (addDays(anchor, d + 1).getTime() <= TARGET) d++;
    anchor = addDays(anchor, d);
    let r = Math.floor((TARGET - anchor.getTime()) / 1000);
    const h = Math.floor(r / 3600); r -= h * 3600;
    const m = Math.floor(r / 60); const s = r - m * 60;
    return { mo, d, h, m, s, rem };
  }

  /* ---------------------------------------------------------------
     Setup
     --------------------------------------------------------------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, F = 1;

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    F = Math.min(H * 0.9, W * 1.6);
  }
  window.addEventListener('resize', resize);
  resize();

  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const R = rng(20271109);
  const pick = a => a[Math.floor(R() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;

  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const HAZE = [96, 44, 140];
  const fogc = (c, f, a = 1) =>
    `rgba(${(c[0] + (HAZE[0] - c[0]) * f) | 0},${(c[1] + (HAZE[1] - c[1]) * f) | 0},${(c[2] + (HAZE[2] - c[2]) * f) | 0},${a})`;

  const C = {
    marigold: hex('#FFB31A'), magenta: hex('#E63B8A'), teal: hex('#12B5A6'),
    paper: hex('#FFF4E0'), violet: hex('#7C5CFF'), flame: hex('#FF5A36'), ink: hex('#1A1150'),
  };
  const COSTUME = [C.marigold, C.magenta, C.teal, C.violet, C.flame, C.paper];
  const PANTS = ['#2B1B5C', '#12345A', '#4A1240', '#1E1E3F', '#F2EAD8'].map(hex);
  const SKIN = ['#F2C7A5', '#D9A07A', '#B97A55', '#8D5A3B', '#5E3A26'].map(hex);
  const CONFETTI = ['#FFB31A', '#E63B8A', '#12B5A6', '#FFF4E0', '#8C6BFF', '#FF5A36'];

  /* World layout (units ≈ metres). The camera rides down the boulevard toward the clock tower. */
  const ZC = 400;          // clock tower z
  const D0 = 270, D1 = 108; // distance to the tower at the start / at zero
  const CAMH = 3;          // you are standing on a float
  const YC = 40, RC = 36;  // dial centre height and radius

  // Buildings lining the boulevard
  const buildings = [];
  for (const side of [-1, 1]) {
    let z = -20;
    while (z < ZC - 70) {
      const len = 8 + R() * 14, h = 12 + R() * 26;
      const base = pick(['#3A1B6E', '#4A1D6B', '#2E1E66', '#55205F', '#3B2A78']);
      const wins = [];
      const cols = Math.floor((len - 1) / 2.6), rows = Math.floor((h - 4) / 3.2);
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
        if (R() < 0.55) wins.push({ c, r, col: R() < 0.75 ? hex('#FFD27A') : pick([C.magenta, C.teal, C.paper]) });
      }
      buildings.push({ side, z0: z, z1: z + len, h, col: hex(base), wins, lights: R() < 0.7 });
      z += len + 0.8;
    }
  }
  const lamps = [];
  for (let z = 6; z < ZC - 60; z += 14) { lamps.push({ x: -10.2, z }); lamps.push({ x: 10.2, z: z + 7 }); }
  const buntings = [];
  for (let z = 22; z < ZC - 70; z += 20) buntings.push({ z, ph: R() * TAU, off: Math.floor(R() * 6) });
  const specks = [];
  for (let i = 0; i < 520; i++) specks.push({ x: (R() * 2 - 1) * 9, z: R() * ZC, c: pick(CONFETTI), a: R() * TAU });

  // Parade members are placed relative to you; u maps to a spot between you and the tower.
  const people = [];
  const roles = ['dancer', 'dancer', 'dancer', 'drummer', 'flag', 'pom'];
  for (let i = 0; i < 70; i++) {
    const u = Math.pow(R(), 1.55);
    let x = (R() * 2 - 1) * 8.4;
    if (u < 0.03 && Math.abs(x) < 2.2) x = Math.sign(x || 1) * (2.2 + R() * 2);
    people.push({
      u, x, h: 1.65 + R() * 0.3, role: pick(roles),
      body: pick(COSTUME), trim: pick(COSTUME), pants: pick(PANTS), skin: pick(SKIN),
      hat: pick(['cone', 'shako', 'crown', 'none', 'cone']), skirt: R() < 0.4,
      sp: 3.2 + R() * 2.2, ph: R() * TAU, jump: 0.6 + R() * 0.8, flag: pick(COSTUME),
    });
  }
  const balloons = [];
  [[0.12, -4.5, 'star'], [0.22, 4.8, 'orb'], [0.34, -3.8, 'cluster'], [0.46, 4.2, 'star'],
   [0.58, -4.6, 'orb'], [0.7, 3.6, 'cluster'], [0.84, -2.5, 'star']].forEach(([u, x, kind], i) => {
    balloons.push({
      u, x, kind, y: 11 + R() * 4, r: kind === 'cluster' ? 2.2 : 2.6 + R() * 0.8, ph: R() * TAU,
      c1: COSTUME[i % 5], c2: COSTUME[(i + 2) % 5],
      handlers: [-1.6, 0, 1.6].map(dx => ({ dx, dz: (R() - 0.5) * 1.5, m: {
        h: 1.75, role: 'hold', body: C.paper, trim: COSTUME[i % 5], pants: PANTS[0], skin: pick(SKIN),
        hat: 'none', skirt: false, sp: 3.5, ph: R() * TAU, jump: 0.4 } })),
    });
  });
  const floats = [];
  [[0.07, 4.6], [0.27, -4.6], [0.5, 4.4], [0.75, -4.2]].forEach(([u, x], i) => {
    floats.push({ u, x, body: COSTUME[(i * 2) % 5], top: COSTUME[(i * 2 + 1) % 5], ph: R() * TAU,
      riders: [-1.6, 1.6].map(dx => ({ dx, m: { h: 1.7, role: 'dancer', body: pick(COSTUME), trim: C.paper,
        pants: pick(PANTS), skin: pick(SKIN), hat: pick(['cone', 'crown']), skirt: R() < 0.5, sp: 4, ph: R() * TAU, jump: 0.8 } })) });
  });

  const stars = Array.from({ length: 130 }, () => ({ x: R(), y: R() * 0.55, r: R() * 1.2 + 0.3, ph: R() * TAU }));
  const skyline = [];
  for (let x = 0; x < 1.02;) { const w = 0.012 + R() * 0.03; skyline.push({ x, w, h: 0.25 + R() * 0.75 }); x += w; }

  /* ---------------------------------------------------------------
     Sound — everything is synthesised live, nothing is downloaded
     --------------------------------------------------------------- */
  const A = { ac: null, master: null, noise: null, on: false, next: 0, step: 0, lastBoom: 0 };
  const MEL = [
    72,0,72,0,76,0,79,0,84,0,0,0,79,0,76,0,
    77,0,77,0,81,0,84,0,86,0,0,0,84,0,0,0,
    76,0,76,0,79,0,84,0,88,0,0,0,86,0,84,0,
    83,0,79,0,81,0,83,0,84,0,0,0,0,0,0,0];
  const ROOTS = [48, 53, 48, 55];
  const CHORDS = [[60, 64, 67], [60, 65, 69], [60, 64, 67], [59, 62, 67]];

  function audioInit() {
    if (A.ac) { if (A.ac.state === 'suspended') A.ac.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    A.ac = new AC();
    const comp = A.ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    A.master = A.ac.createGain(); A.master.gain.value = 0;
    A.master.connect(comp); comp.connect(A.ac.destination);
    const len = A.ac.sampleRate * 2, buf = A.ac.createBuffer(1, len, A.ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    A.noise = buf;
    setInterval(schedule, 25);
    return true;
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function env(g, t, v, a, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function kick(t, v) {
    const ac = A.ac, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    env(g, t, v, 0.004, 0.38); o.connect(g).connect(A.master); o.start(t); o.stop(t + 0.42);
  }
  function noise(t, v, dur, type, freq, q = 0.8) {
    const ac = A.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = A.noise; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
    env(g, t, v, 0.003, dur); s.connect(f).connect(g).connect(A.master);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  function snare(t, v) {
    noise(t, v, 0.2, 'bandpass', 1900, 0.7);
    const ac = A.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    env(g, t, v * 0.5, 0.002, 0.1); o.connect(g).connect(A.master); o.start(t); o.stop(t + 0.12);
  }
  function voice(t, midi, dur, v, type = 'sawtooth', cut = 2600) {
    const ac = A.ac, g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(cut * 0.35, t); f.frequency.exponentialRampToValueAtTime(cut, t + 0.04);
    f.frequency.exponentialRampToValueAtTime(cut * 0.4, t + dur);
    env(g, t, v, 0.012, dur);
    f.connect(g).connect(A.master);
    [-7, 7].forEach(dt => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = mtof(midi); o.detune.value = dt;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function schedule() {
    if (!A.ac) return;
    const ac = A.ac;
    if (!A.on) { A.next = ac.currentTime + 0.05; return; }
    while (A.next < ac.currentTime + 0.12) {
      const st = A.step, t = A.next, s16 = st % 16, bar = Math.floor(st / 16);
      if (finaleOn) {
        if (s16 % 4 === 0) kick(t, 0.9);
        if (s16 === 4 || s16 === 12) snare(t, 0.5);
        if (s16 % 4 === 2) noise(t, 0.12, 0.09, 'highpass', 7500);
        else noise(t, 0.04, 0.03, 'highpass', 9000);
        if ([0, 3, 6, 8, 10, 12, 14].includes(s16)) voice(t, ROOTS[bar] - 12 + (s16 % 4 === 2 ? 12 : 0), 0.16, 0.22, 'sawtooth', 700);
        if (s16 === 0) CHORDS[bar].forEach(n => voice(t, n, 1.7, 0.05, 'sawtooth', 1200));
        const n = MEL[st];
        if (n) { let k = 1; while (k < 6 && !MEL[(st + k) % 64]) k++; voice(t, n, Math.min(0.5, k * 0.11), 0.13, 'square', 3200); }
      } else {
        // a quiet parade march while we wait
        if (s16 === 0 || s16 === 8) kick(t, 0.35);
        if (s16 === 4 || s16 === 12) snare(t, 0.16);
        if (s16 === 14 || s16 === 15) snare(t, 0.06);
        if (s16 === 0 || s16 === 8) voice(t, (s16 === 0 ? 36 : 43) + (bar % 2 ? 5 : 0), 0.3, 0.12, 'triangle', 600);
      }
      A.next += 60 / (finaleOn ? 128 : 108) / 4;
      A.step = (A.step + 1) % 64;
    }
  }
  function boom(v) {
    if (!A.on || !A.ac) return;
    const t = A.ac.currentTime;
    if (t - A.lastBoom < 0.12) return;
    A.lastBoom = t;
    noise(t, v, 1.1, 'lowpass', 260, 0.5);
    noise(t + 0.25, v * 0.25, 0.5, 'highpass', 4500);
  }
  function tick(n) {
    if (!A.on || !A.ac) return;
    const t = A.ac.currentTime;
    voice(t, 72 + (10 - n) * 1, 0.25, 0.2, 'triangle', 3000);
    kick(t, 0.6);
  }
  function crash() {
    if (!A.on || !A.ac) return;
    const t = A.ac.currentTime;
    noise(t, 0.6, 2.8, 'highpass', 3200, 0.4);
    kick(t, 1); noise(t, 0.9, 1.6, 'lowpass', 200, 0.4);
    [60, 64, 67, 72, 76].forEach((n, i) => voice(t + i * 0.06, n, 1.6, 0.08, 'sawtooth', 2800));
  }

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  let mode = 'live';           // 'live' | 'preview'
  let pv0 = 0, pvFrom = 0;     // preview start (perf time) and the real time it started from
  const RUSH = 7000, FINAL = 5500;
  let finaleOn = false, finaleT = 0;
  let lastTickSec = -1, flash = 0, T = 0;

  function simNow(now) {
    if (mode !== 'preview') return realNow();
    const el = now - pv0;
    const goal = TARGET - FINAL;
    if (el < RUSH) {
      const k = el / RUSH, e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      return pvFrom + (goal - pvFrom) * e;
    }
    return goal + (el - RUSH);
  }

  /* ---------------------------------------------------------------
     Projection
     --------------------------------------------------------------- */
  let camZ = 0, HZ = 0, dist = D0;
  function P(x, y, z) {
    const dz = z - camZ;
    if (dz < 0.3) return null;
    const k = F / dz;
    return [W / 2 + x * k, HZ - (y - CAMH) * k, k, dz];
  }
  const fogOf = dz => Math.min(0.82, dz / 300);

  /* ---------------------------------------------------------------
     Fireworks, confetti, rings
     --------------------------------------------------------------- */
  const rockets = [], sparks = [], glows = [], confetti = [], rings = [];
  const SPARK_CAP = reduce ? 500 : 2400;
  const FW_COLS = ['#FFB31A', '#E63B8A', '#12B5A6', '#FFF4E0', '#8C6BFF', '#FF5A36', '#FFE066'];

  function launch(layer) {
    const front = layer === 'front';
    const x = W * (0.08 + R() * 0.84);
    const y0 = front ? H + 10 : HZ;
    const ty = H * (0.06 + R() * (front ? 0.36 : 0.3));
    const g = H * 0.55;
    rockets.push({ x, y: y0, vx: (R() - 0.5) * W * 0.04, vy: -Math.sqrt(2 * g * Math.max(40, y0 - ty)), g, layer,
      type: pick(['peony', 'peony', 'ring', 'willow', 'duo']), c: pick(FW_COLS), c2: pick(FW_COLS), size: front ? 1.25 : 1 });
  }
  function explode(r) {
    const n = Math.min(SPARK_CAP - sparks.length, Math.round((r.type === 'willow' ? 90 : 110) * (reduce ? 0.5 : 1)));
    const base = Math.min(W, H) * 0.42 * r.size * (0.75 + R() * 0.5);
    const tilt = 0.55 + R() * 0.45;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + R() * 0.05;
      let sp;
      if (r.type === 'ring') sp = base * 0.85;
      else if (r.type === 'willow') sp = base * (0.35 + R() * 0.4);
      else sp = base * Math.sqrt(R());
      sparks.push({
        x: r.x, y: r.y, px: r.x, py: r.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * (r.type === 'ring' ? tilt : 1),
        life: 0, max: r.type === 'willow' ? 2.6 + R() : 1.2 + R() * 0.7,
        c: r.type === 'duo' && i % 2 ? r.c2 : r.type === 'willow' ? '#FFD36B' : r.c,
        drag: r.type === 'willow' ? 1.6 : 2.3, g: r.type === 'willow' ? H * 0.14 : H * 0.09,
        w: (r.type === 'willow' ? 1.6 : 2.2) * r.size, layer: r.layer, crackle: finaleOn && R() < 0.15,
      });
    }
    if (r.layer === 'back') glows.push({ x: r.x, y: r.y, r: Math.min(W, H) * 0.5, c: r.c, life: 0 });
    boom(r.layer === 'front' ? 0.7 : 0.45);
  }

  function addConfetti(n, cannon) {
    for (let i = 0; i < n; i++) {
      const fromLeft = R() < 0.5;
      confetti.push(cannon ? {
        x: fromLeft ? -10 : W + 10, y: H * (0.75 + R() * 0.2),
        vx: (fromLeft ? 1 : -1) * W * (0.25 + R() * 0.45), vy: -H * (0.9 + R() * 0.7),
        rot: R() * TAU, vr: (R() - 0.5) * 14, w: 6 + R() * 7, h: 3 + R() * 4, c: pick(CONFETTI), ph: R() * TAU, fr: 4 + R() * 6,
      } : {
        x: R() * W, y: -20 - R() * H * 0.3, vx: (R() - 0.5) * 40, vy: 40 + R() * 60,
        rot: R() * TAU, vr: (R() - 0.5) * 10, w: 5 + R() * 6, h: 3 + R() * 3, c: pick(CONFETTI), ph: R() * TAU, fr: 3 + R() * 5,
      });
    }
  }

  /* ---------------------------------------------------------------
     Drawing: people, balloons, floats, street furniture
     --------------------------------------------------------------- */
  function drawPerson(m, sx, sy, s, f) {
    if (s < 1.1) return;
    const E = finaleOn ? 1.9 : (mode === 'preview' ? 1.4 : 1);
    const ph = T * m.sp * (finaleOn ? 1.25 : 1) + m.ph;
    let hop = Math.abs(Math.sin(ph)) * 0.06;
    if (finaleOn && !reduce) hop += Math.max(0, Math.sin(ph * 0.5)) * 0.4 * m.jump;
    const y0 = sy - hop * s;
    const sc = m.h / 1.8;
    const hipY = y0 - 0.92 * s * sc, shY = y0 - 1.42 * s * sc, headY = y0 - 1.63 * s * sc, hr = 0.14 * s;
    const lw = Math.max(1, 0.1 * s);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // legs
    const st = Math.sin(ph) * 0.15 * s;
    ctx.strokeStyle = fogc(m.pants, f); ctx.lineWidth = lw * 1.2;
    ctx.beginPath();
    ctx.moveTo(sx - 0.08 * s, hipY); ctx.lineTo(sx - 0.12 * s + st, y0 - (st > 0 ? 0.07 * s : 0));
    ctx.moveTo(sx + 0.08 * s, hipY); ctx.lineTo(sx + 0.12 * s - st, y0 - (st < 0 ? 0.07 * s : 0));
    ctx.stroke();

    // body
    ctx.fillStyle = fogc(m.body, f);
    ctx.beginPath();
    if (m.skirt) {
      ctx.moveTo(sx - 0.19 * s, shY); ctx.lineTo(sx + 0.19 * s, shY);
      ctx.lineTo(sx + 0.4 * s, hipY + 0.16 * s); ctx.lineTo(sx - 0.4 * s, hipY + 0.16 * s);
    } else {
      ctx.moveTo(sx - 0.22 * s, shY); ctx.lineTo(sx + 0.22 * s, shY);
      ctx.lineTo(sx + 0.17 * s, hipY + 0.05 * s); ctx.lineTo(sx - 0.17 * s, hipY + 0.05 * s);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = fogc(m.trim, f); ctx.lineWidth = lw * 0.7;
    ctx.beginPath(); ctx.moveTo(sx - 0.19 * s, shY + 0.03 * s); ctx.lineTo(sx + 0.16 * s, hipY); ctx.stroke();

    // arms
    const armLen = 0.6 * s;
    const arm = (sxo, a, bend) => {
      const ox = sx + sxo * 0.2 * s, oy = shY + 0.04 * s;
      const ex = ox + Math.cos(a) * armLen * 0.5, ey = oy + Math.sin(a) * armLen * 0.5;
      const hx = ex + Math.cos(a + bend) * armLen * 0.5, hy = ey + Math.sin(a + bend) * armLen * 0.5;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
      return [hx, hy];
    };
    ctx.strokeStyle = fogc(m.body, f * 0.9 + 0.05); ctx.lineWidth = lw;
    if (m.role === 'drummer') {
      const dy = hipY - 0.06 * s;
      ctx.fillStyle = fogc(m.trim, f);
      ctx.beginPath(); ctx.ellipse(sx, dy, 0.27 * s, 0.17 * s, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, lw * 0.5);
      ctx.beginPath(); ctx.ellipse(sx, dy - 0.07 * s, 0.27 * s, 0.07 * s, 0, 0, TAU); ctx.stroke();
      ctx.strokeStyle = fogc(m.body, f); ctx.lineWidth = lw;
      const hitL = Math.max(0, Math.sin(ph * 2)), hitR = Math.max(0, Math.sin(ph * 2 + Math.PI));
      [[-1, hitL], [1, hitR]].forEach(([sd, hit]) => {
        const [hx, hy] = arm(sd, Math.PI / 2 + sd * -0.9, sd * -1.1 - hit * sd * 0.6);
        ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, lw * 0.4);
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - sd * 0.12 * s, hy - 0.22 * s * (0.3 + hit)); ctx.stroke();
        ctx.strokeStyle = fogc(m.body, f); ctx.lineWidth = lw;
      });
    } else if (m.role === 'flag') {
      const [hx, hy] = arm(1, -Math.PI / 2 + 0.25, -0.2);
      arm(-1, Math.PI / 2 + 0.35 + Math.sin(ph) * 0.2, 0.3);
      ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, lw * 0.45);
      ctx.beginPath(); ctx.moveTo(hx, hy + 0.3 * s); ctx.lineTo(hx, hy - 1.0 * s); ctx.stroke();
      ctx.fillStyle = fogc(m.flag || m.trim, f);
      const fw = 0.75 * s, fh = 0.45 * s, wv = Math.sin(T * 6 + m.ph) * 0.08 * s;
      ctx.beginPath(); ctx.moveTo(hx, hy - 1.0 * s);
      ctx.quadraticCurveTo(hx + fw * 0.5, hy - 1.0 * s - wv, hx + fw, hy - 1.0 * s + wv);
      ctx.lineTo(hx + fw, hy - 1.0 * s + fh + wv);
      ctx.quadraticCurveTo(hx + fw * 0.5, hy - 1.0 * s + fh - wv, hx, hy - 1.0 * s + fh);
      ctx.closePath(); ctx.fill();
    } else if (m.role === 'hold') {
      arm(-1, -Math.PI / 2 - 0.25, 0.1); arm(1, -Math.PI / 2 + 0.25, -0.1);
    } else {
      const amp = 0.5 * E;
      const [lx, ly] = arm(-1, -Math.PI / 2 - 0.7 - Math.sin(ph * 2) * amp, -0.4);
      const [rx, ry] = arm(1, -Math.PI / 2 + 0.7 + Math.sin(ph * 2 + 1.3) * amp, 0.4);
      if (m.role === 'pom') {
        ctx.fillStyle = fogc(m.trim, f);
        ctx.beginPath(); ctx.arc(lx, ly, 0.12 * s, 0, TAU); ctx.arc(rx, ry, 0.12 * s, 0, TAU); ctx.fill();
      }
    }

    // head + hat
    ctx.fillStyle = fogc(m.skin, f);
    ctx.beginPath(); ctx.arc(sx, headY, hr, 0, TAU); ctx.fill();
    if (m.hat === 'cone') {
      ctx.fillStyle = fogc(m.trim, f);
      ctx.beginPath(); ctx.moveTo(sx - hr * 0.85, headY - hr * 0.6); ctx.lineTo(sx + hr * 0.85, headY - hr * 0.6);
      ctx.lineTo(sx + hr * 0.15, headY - hr * 2.9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = fogc(C.paper, f);
      ctx.beginPath(); ctx.arc(sx + hr * 0.15, headY - hr * 2.9, hr * 0.32, 0, TAU); ctx.fill();
    } else if (m.hat === 'shako') {
      ctx.fillStyle = fogc(C.ink, f * 0.7);
      ctx.fillRect(sx - hr * 0.85, headY - hr * 2.3, hr * 1.7, hr * 1.8);
      ctx.fillStyle = fogc(m.trim, f);
      ctx.fillRect(sx - hr * 0.85, headY - hr * 0.75, hr * 1.7, hr * 0.25);
      ctx.beginPath(); ctx.ellipse(sx, headY - hr * 2.7, hr * 0.35, hr * 0.7, 0, 0, TAU); ctx.fill();
    } else if (m.hat === 'crown') {
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = fogc(COSTUME[(i + (m.ph * 3 | 0)) % 6], f);
        ctx.beginPath(); ctx.arc(sx + (i - 2) * hr * 0.45, headY - hr * 0.95 - (i % 2) * hr * 0.15, hr * 0.28, 0, TAU); ctx.fill();
      }
    }
  }

  function drawBalloon(b, z, f) {
    const sway = Math.sin(T * 0.7 + b.ph) * (finaleOn ? 0.9 : 0.4);
    const bob = Math.sin(T * 0.9 + b.ph) * (finaleOn ? 0.9 : 0.4);
    const c = P(b.x + sway, b.y + bob, z);
    if (!c) return;
    const [sx, sy, k] = c, r = b.r * k;
    if (r < 1) return;

    // handlers and tethers
    const ends = [];
    b.handlers.forEach(h => {
      const g = P(b.x + h.dx, 0, z + h.dz);
      if (!g) return;
      drawPerson(h.m, g[0], g[1], g[2], fogOf(g[3]));
      ends.push([g[0], g[1] - 1.9 * g[2]]);
    });
    ctx.strokeStyle = fogc(C.paper, f, 0.7); ctx.lineWidth = Math.max(0.6, 0.035 * k);
    ctx.beginPath();
    ends.forEach(([ex, ey]) => { ctx.moveTo(sx, sy + r * 0.8); ctx.lineTo(ex, ey); });
    ctx.stroke();

    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(sway * 0.06);
    if (b.kind === 'star') {
      ctx.rotate(Math.sin(T * 0.5 + b.ph) * 0.12);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.48 : r * 1.1;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = fogc(b.c1, f); ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.08); ctx.strokeStyle = fogc(b.c2, f); ctx.stroke();
      ctx.fillStyle = fogc(C.paper, f, 0.45);
      ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.35, r * 0.18, r * 0.09, -0.6, 0, TAU); ctx.fill();
    } else if (b.kind === 'orb') {
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
      ctx.fillStyle = fogc(b.c1, f); ctx.fillRect(-r, -r, 2 * r, 2 * r);
      ctx.fillStyle = fogc(b.c2, f);
      const spin = (T * 0.4 + b.ph) % 1;
      for (let i = -3; i < 3; i++) {
        const x0 = ((i + spin) / 3) * r;
        ctx.beginPath(); ctx.ellipse(x0, 0, r * 0.16, r, 0, 0, TAU); ctx.fill();
      }
      const gr = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      gr.addColorStop(0, 'rgba(255,255,255,.35)'); gr.addColorStop(0.6, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(20,10,60,.45)');
      ctx.fillStyle = gr; ctx.fillRect(-r, -r, 2 * r, 2 * r);
      ctx.restore();
    } else {
      const pts = [[0, -0.55], [-0.6, -0.15], [0.6, -0.15], [-0.35, 0.45], [0.35, 0.45], [0, 0.05]];
      pts.forEach(([px, py], i) => {
        ctx.fillStyle = fogc(COSTUME[(i + (b.ph * 2 | 0)) % 6], f);
        ctx.beginPath(); ctx.arc(px * r, py * r, r * 0.48, 0, TAU); ctx.fill();
        ctx.fillStyle = fogc(C.paper, f, 0.4);
        ctx.beginPath(); ctx.arc(px * r - r * 0.15, py * r - r * 0.17, r * 0.1, 0, TAU); ctx.fill();
      });
    }
    ctx.restore();
  }

  function drawFloat(fl, z, f) {
    const x = fl.x;
    const a = P(x - 3, 0.3, z), b = P(x + 3, 0.3, z), c = P(x + 3, 2.6, z), d = P(x - 3, 2.6, z);
    const e = P(x + 3, 2.6, z + 4), g = P(x - 3, 2.6, z + 4);
    if (!a || !e) return;
    const k = a[2];
    // top deck
    ctx.fillStyle = fogc(fl.top, f);
    ctx.beginPath(); ctx.moveTo(d[0], d[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(e[0], e[1]); ctx.lineTo(g[0], g[1]); ctx.closePath(); ctx.fill();
    // riders on the deck
    fl.riders.forEach(rd => { const q = P(x + rd.dx, 2.6, z + 1.6); if (q) drawPerson(rd.m, q[0], q[1], q[2], fogOf(q[3])); });
    // pinwheel
    const hub = P(x, 6, z + 2.2), foot = P(x, 2.6, z + 2.2);
    if (hub && foot) {
      ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, 0.12 * hub[2]);
      ctx.beginPath(); ctx.moveTo(foot[0], foot[1]); ctx.lineTo(hub[0], hub[1]); ctx.stroke();
      const rr = 2.2 * hub[2], rot = T * (finaleOn ? 3 : 1.2) + fl.ph;
      for (let i = 0; i < 8; i++) {
        const a0 = rot + (i * TAU) / 8;
        ctx.fillStyle = fogc(COSTUME[i % 6], f);
        ctx.beginPath(); ctx.moveTo(hub[0], hub[1]);
        ctx.lineTo(hub[0] + Math.cos(a0) * rr, hub[1] + Math.sin(a0) * rr);
        ctx.lineTo(hub[0] + Math.cos(a0 + 0.55) * rr * 0.55, hub[1] + Math.sin(a0 + 0.55) * rr * 0.55);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = fogc(C.paper, f);
      ctx.beginPath(); ctx.arc(hub[0], hub[1], rr * 0.12, 0, TAU); ctx.fill();
    }
    // front face
    ctx.fillStyle = fogc(fl.body, f);
    ctx.fillRect(a[0], d[1], b[0] - a[0], a[1] - d[1]);
    // scalloped skirt
    const n = 8, wseg = (b[0] - a[0]) / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = fogc(i % 2 ? C.paper : fl.top, f);
      ctx.beginPath(); ctx.arc(a[0] + wseg * (i + 0.5), a[1] - 0.05 * k, wseg / 2, Math.PI, 0); ctx.fill();
    }
    // bulb garland
    for (let i = 0; i <= 12; i++) {
      const on = ((i + Math.floor(T * 6)) % 3) === 0;
      ctx.fillStyle = on ? 'rgba(255,240,180,1)' : fogc(C.marigold, f, 0.7);
      ctx.beginPath(); ctx.arc(a[0] + (b[0] - a[0]) * i / 12, d[1] + 0.12 * k, Math.max(1, 0.09 * k), 0, TAU); ctx.fill();
    }
  }

  function drawLamp(l) {
    const b = P(l.x, 0, l.z), t = P(l.x, 6, l.z);
    if (!b || !t) return;
    const f = fogOf(b[3]), k = b[2];
    ctx.strokeStyle = fogc(hex('#2A1A4E'), f); ctx.lineWidth = Math.max(1, 0.16 * k);
    ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(t[0], t[1]); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,190,90,0.12)';
    ctx.beginPath(); ctx.arc(t[0], t[1], 1.4 * k, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = fogc(hex('#FFE3A3'), f * 0.5);
    ctx.beginPath(); ctx.arc(t[0], t[1], Math.max(1, 0.38 * k), 0, TAU); ctx.fill();
  }

  function drawBunting(bt) {
    const l = P(-10.2, 7.6, bt.z), r = P(10.2, 7.6, bt.z);
    if (!l || !r) return;
    const k = l[2], f = fogOf(l[3]), sag = 1.6 * k;
    const mx = (l[0] + r[0]) / 2, my = l[1] + sag * 2;
    ctx.strokeStyle = fogc(C.paper, f, 0.8); ctx.lineWidth = Math.max(0.6, 0.04 * k);
    ctx.beginPath(); ctx.moveTo(l[0], l[1]); ctx.quadraticCurveTo(mx, my, r[0], r[1]); ctx.stroke();
    const n = 26;
    for (let i = 1; i < n; i++) {
      const t = i / n, u = 1 - t;
      const x = u * u * l[0] + 2 * u * t * mx + t * t * r[0];
      const y = u * u * l[1] + 2 * u * t * my + t * t * r[1];
      const fw = 0.34 * k, fh = 0.75 * k, wv = Math.sin(T * 4 + i + bt.ph) * 0.12 * k;
      ctx.fillStyle = fogc(COSTUME[(i + bt.off) % 6], f);
      ctx.beginPath(); ctx.moveTo(x - fw, y); ctx.lineTo(x + fw, y); ctx.lineTo(x + wv, y + fh); ctx.closePath(); ctx.fill();
    }
  }

  function drawBuilding(bd) {
    const x = bd.side * 13;
    const z0 = Math.max(bd.z0, camZ + 0.35);
    if (bd.z1 <= z0) return;
    const a = P(x, 0, z0), b = P(x, bd.h, z0), c = P(x, bd.h, bd.z1), d = P(x, 0, bd.z1);
    const mid = (z0 + bd.z1) / 2 - camZ, f = fogOf(mid);
    ctx.fillStyle = fogc(bd.col, f);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill();
    // cornice
    ctx.strokeStyle = fogc(C.ink, f * 0.6); ctx.lineWidth = Math.max(1, 0.4 * b[2]);
    ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
    if (mid > 230) return;
    // windows
    for (const w of bd.wins) {
      const za = bd.z0 + 0.9 + w.c * 2.6, zb = za + 1.3;
      if (za < camZ + 0.4) continue;
      const ya = 3 + w.r * 3.2, yb = ya + 1.7;
      const p1 = P(x, ya, za), p2 = P(x, yb, za), p3 = P(x, yb, zb), p4 = P(x, ya, zb);
      ctx.fillStyle = fogc(w.col, f * 0.8, 0.85);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.lineTo(p4[0], p4[1]); ctx.closePath(); ctx.fill();
    }
    // string lights along the roofline
    if (bd.lights && mid < 160) {
      for (let zz = Math.ceil(z0 / 2.5) * 2.5; zz < bd.z1; zz += 2.5) {
        const q = P(x, bd.h - 0.4 - Math.sin((zz - bd.z0) / (bd.z1 - bd.z0) * Math.PI) * 1.2, zz);
        if (!q) continue;
        const on = ((zz / 2.5 | 0) + Math.floor(T * (finaleOn ? 8 : 2))) % 2;
        ctx.fillStyle = on ? CONFETTI[(zz / 2.5 | 0) % 6] : fogc(C.paper, 0.6, 0.4);
        ctx.beginPath(); ctx.arc(q[0], q[1], Math.max(0.8, 0.16 * q[2]), 0, TAU); ctx.fill();
      }
    }
  }

  /* ---------------------------------------------------------------
     The clock tower
     --------------------------------------------------------------- */
  const pad = n => String(n).padStart(2, '0');
  function drawTower(bd, rem) {
    const k = F / dist, cx = W / 2, gy = HZ + CAMH * k;
    const X = x => cx + x * k, Y = y => gy - y * k;
    const dcy = Y(YC), dr = RC * k;

    // halo
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(cx, dcy, dr * 0.6, cx, dcy, dr * 2.4);
    halo.addColorStop(0, finaleOn ? 'rgba(255,190,80,.45)' : 'rgba(230,59,138,.30)');
    halo.addColorStop(1, 'rgba(230,59,138,0)');
    ctx.fillStyle = halo; ctx.fillRect(cx - dr * 2.5, dcy - dr * 2.5, dr * 5, dr * 5);
    ctx.globalCompositeOperation = 'source-over';

    // plinth steps
    ['#4B2378', '#5A2A86', '#6A3294'].forEach((c, i) => {
      ctx.fillStyle = c;
      const w = 62 - i * 6;
      ctx.fillRect(X(-w), Y((i + 1) * 1.4), w * 2 * k, 1.4 * k + 1);
    });

    // body
    const body = ctx.createLinearGradient(0, Y(4), 0, Y(86));
    body.addColorStop(0, '#9A2470'); body.addColorStop(1, '#40197A');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(X(-44), Y(4)); ctx.lineTo(X(-44), Y(80)); ctx.lineTo(X(-34), Y(86)); ctx.lineTo(X(-24), Y(86));
    ctx.lineTo(X(-24), Y(92)); ctx.lineTo(X(24), Y(92)); ctx.lineTo(X(24), Y(86)); ctx.lineTo(X(34), Y(86));
    ctx.lineTo(X(44), Y(80)); ctx.lineTo(X(44), Y(4)); ctx.closePath(); ctx.fill();
    // crown pennants
    for (let i = 0; i < 9; i++) {
      const px = -20 + i * 5, top = 92 + (i % 2 ? 6 : 9);
      ctx.strokeStyle = '#FFF4E0'; ctx.lineWidth = Math.max(1, 0.3 * k);
      ctx.beginPath(); ctx.moveTo(X(px), Y(92)); ctx.lineTo(X(px), Y(top)); ctx.stroke();
      const wv = Math.sin(T * 5 + i) * 0.6;
      ctx.fillStyle = CONFETTI[i % 6];
      ctx.beginPath(); ctx.moveTo(X(px), Y(top)); ctx.lineTo(X(px + 3.4), Y(top - 1 + wv)); ctx.lineTo(X(px), Y(top - 2.2)); ctx.closePath(); ctx.fill();
    }
    // star on top
    ctx.save(); ctx.translate(X(0), Y(106)); ctx.rotate(T * 0.4);
    ctx.fillStyle = '#FFB31A'; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = (i % 2 ? 2.4 : 5.6) * k; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();

    // marquee bulb columns on the tower edges
    for (const sx of [-40, 40]) {
      for (let y = 8; y < 78; y += 3) {
        const i = Math.round(y / 3);
        const on = finaleOn ? (i + Math.floor(T * 14)) % 3 === 0 : (i + Math.floor(T * 3)) % 4 === 0;
        ctx.fillStyle = on ? (finaleOn ? CONFETTI[(i + Math.floor(T * 7)) % 6] : '#FFF0B8') : 'rgba(255,200,120,.35)';
        ctx.beginPath(); ctx.arc(X(sx), Y(y), Math.max(1, 0.7 * k), 0, TAU); ctx.fill();
      }
    }

    // dial: outer ring
    ctx.fillStyle = '#E63B8A';
    ctx.beginPath(); ctx.arc(cx, dcy, dr * 1.04, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFB31A';
    ctx.beginPath(); ctx.arc(cx, dcy, dr * 0.98, 0, TAU); ctx.fill();
    // face
    const face = ctx.createRadialGradient(cx, dcy - dr * 0.3, dr * 0.1, cx, dcy, dr * 0.86);
    face.addColorStop(0, '#FFFBF2'); face.addColorStop(1, '#F6E3C2');
    ctx.fillStyle = face;
    ctx.beginPath(); ctx.arc(cx, dcy, dr * 0.85, 0, TAU); ctx.fill();

    // 60 seconds bulbs: they fill up as the minute passes
    const secIdx = finaleOn ? -1 : Math.floor((bd.s === 0 && rem > 0 ? 60 : 60 - bd.s)) % 60;
    for (let i = 0; i < 60; i++) {
      const a = -Math.PI / 2 + (i / 60) * TAU;
      const bx = cx + Math.cos(a) * dr * 0.915, by = dcy + Math.sin(a) * dr * 0.915;
      let col;
      if (finaleOn) col = CONFETTI[(i + Math.floor(T * 12)) % 6];
      else col = i <= secIdx ? (i % 5 === 0 ? '#FFFFFF' : '#FFF0B8') : 'rgba(150,60,20,.35)';
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(bx, by, Math.max(1, dr * (i % 5 === 0 ? 0.028 : 0.018)), 0, TAU); ctx.fill();
    }
    // inner rule
    ctx.strokeStyle = 'rgba(26,17,80,.18)'; ctx.lineWidth = Math.max(1, dr * 0.006);
    ctx.beginPath(); ctx.arc(cx, dcy, dr * 0.8, 0, TAU); ctx.stroke();

    // numerals
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    if (finaleOn) {
      const pulse = reduce ? 1 : 1 + Math.sin(T * 8.4) * 0.03;
      ctx.fillStyle = '#1A1150';
      ctx.font = `900 ${dr * 0.56 * pulse}px "Big Shoulders Display", Impact, sans-serif`;
      ctx.fillText('Today', cx, dcy + dr * 0.12);
      ctx.fillStyle = '#B0236B';
      ctx.font = `700 ${dr * 0.095}px "Bricolage Grotesque", system-ui, sans-serif`;
      ctx.fillText('9 November 2027', cx, dcy + dr * 0.36);
    } else if (rem <= 10000) {
      const n = Math.ceil(rem / 1000), fr = (rem / 1000) % 1;
      const sc = reduce ? 1 : 1 + fr * 0.18;
      ctx.fillStyle = '#1A1150';
      ctx.font = `900 ${dr * 1.05 * sc}px "Big Shoulders Display", Impact, sans-serif`;
      ctx.fillText(String(n), cx, dcy + dr * 0.36 * sc);
    } else {
      const vals = [bd.mo, bd.d, bd.h, bd.m, bd.s];
      const names = [['month', 'months'], ['day', 'days'], ['hour', 'hours'], ['minute', 'minutes'], ['second', 'seconds']];
      const cw = dr * 0.31;
      vals.forEach((v, i) => {
        const x = cx + (i - 2) * cw;
        ctx.fillStyle = '#1A1150';
        ctx.font = `800 ${dr * 0.36}px "Big Shoulders Display", Impact, sans-serif`;
        ctx.fillText(pad(v), x, dcy + dr * 0.08);
        ctx.fillStyle = '#B0236B';
        ctx.font = `700 ${dr * 0.064}px "Bricolage Grotesque", system-ui, sans-serif`;
        ctx.fillText(names[i][v === 1 ? 0 : 1], x, dcy + dr * 0.2);
      });
      ctx.fillStyle = '#1A1150';
      ctx.font = `700 ${dr * 0.078}px "Bricolage Grotesque", system-ui, sans-serif`;
      ctx.fillText('until 9 November 2027', cx, dcy + dr * 0.44);
      // three little diamonds as an ornament
      [-1, 0, 1].forEach((i, j) => {
        ctx.fillStyle = ['#12B5A6', '#E63B8A', '#FFB31A'][j];
        ctx.save(); ctx.translate(cx + i * dr * 0.09, dcy - dr * 0.42); ctx.rotate(Math.PI / 4);
        const s = dr * 0.035; ctx.fillRect(-s, -s, 2 * s, 2 * s); ctx.restore();
      });
    }

    return { cx, dcy, dr, X, Y, k };
  }

  /* ---------------------------------------------------------------
     Main loop
     --------------------------------------------------------------- */
  const finaleBtn = document.getElementById('finaleBtn');
  const replayBtn = document.getElementById('replayBtn');
  const soundBtn = document.getElementById('soundBtn');
  const finaleText = document.getElementById('finaleText');
  const finaleSub = document.getElementById('finaleSub');
  const routeText = document.getElementById('routeText');
  const routeSub = document.getElementById('routeSub');
  const routeFill = document.getElementById('routeFill');
  const live = document.getElementById('live');

  let nextLaunch = 0, nextRing = 0, lastRoute = '', lastLive = 0;
  let last = performance.now();

  function startFinale() {
    finaleOn = true; finaleT = T;
    flash = reduce ? 0.25 : 1;
    for (let i = 0; i < (reduce ? 4 : 14); i++) launch(i % 2 ? 'front' : 'back');
    addConfetti(reduce ? 60 : 320, true);
    rings.push({ r: 1, life: 0 }, { r: 1, life: -0.25 }, { r: 1, life: -0.5 });
    crash();
    finaleText.hidden = false;
    finaleText.classList.remove('show'); void finaleText.offsetWidth; finaleText.classList.add('show');
    if (mode === 'preview') {
      finaleSub.textContent = 'This is a preview. The real party starts at midnight on 9 November 2027.';
      replayBtn.hidden = false;
    } else {
      finaleSub.textContent = 'The parade made it to the clock.';
      finaleBtn.hidden = true;
    }
    live.textContent = 'Zero. It is 9 November 2027. Fireworks and music fill the sky.';
  }

  function backToToday() {
    mode = 'live'; finaleOn = false; lastTickSec = -1;
    finaleText.hidden = true; finaleText.classList.remove('show');
    replayBtn.hidden = true;
    finaleBtn.textContent = 'Skip to the finale';
    rockets.length = 0; sparks.length = 0; glows.length = 0; rings.length = 0;
    confetti.splice(0, confetti.length);
    lastLive = 0;
  }

  function startPreview() {
    if (finaleOn && mode === 'live') return;
    backToToday();
    mode = 'preview'; pv0 = performance.now(); pvFrom = realNow();
    finaleBtn.textContent = 'Back to today';
    if (!A.on) setSound(true);
  }

  function setSound(on) {
    if (on && !audioInit()) return;
    A.on = on;
    if (A.ac) {
      A.master.gain.cancelScheduledValues(A.ac.currentTime);
      A.master.gain.setTargetAtTime(on ? 0.75 : 0, A.ac.currentTime, 0.05);
      A.next = A.ac.currentTime + 0.05;
    }
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.textContent = on ? 'Turn sound off' : 'Turn sound on';
  }

  finaleBtn.addEventListener('click', () => { mode === 'preview' ? backToToday() : startPreview(); });
  replayBtn.addEventListener('click', startPreview);
  soundBtn.addEventListener('click', () => setSound(!A.on));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && mode === 'preview') backToToday(); });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    const sim = simNow(now);
    const bd = breakdown(sim);
    if (bd.rem <= 0 && !finaleOn) startFinale();

    // final-seconds ticks
    if (!finaleOn && bd.rem <= 10000 && bd.rem > 0) {
      const sec = Math.ceil(bd.rem / 1000);
      if (sec !== lastTickSec) { lastTickSec = sec; tick(sec); }
    }

    const p = clamp((sim - START) / (TARGET - START), 0, 1);
    dist = D0 + (D1 - D0) * p;
    camZ = ZC - dist;
    HZ = H * (0.40 - 0.09 * p) + (YC - CAMH) * F / dist;

    // route text
    const day = clamp(Math.floor((sim - START) / 864e5) + 1, 1, TOTAL_DAYS);
    const rt = finaleOn ? 'The parade has reached the clock' : `Day ${day} of ${TOTAL_DAYS} on the parade route`;
    if (rt !== lastRoute) {
      lastRoute = rt; routeText.textContent = rt;
      routeSub.textContent = finaleOn ? 'Zero hour, 9 November 2027.'
        : mode === 'preview' ? 'Fast-forwarding to the finale.'
        : `${Math.round(p * 100)}% of the way. The clock gets closer every day.`;
    }
    routeFill.style.width = (p * 100).toFixed(2) + '%';

    // screen-reader summary once a minute
    if (!finaleOn && mode === 'live' && now - lastLive > 60000) {
      lastLive = now;
      const parts = [[bd.mo, 'month'], [bd.d, 'day'], [bd.h, 'hour'], [bd.m, 'minute']]
        .map(([v, n]) => `${v} ${n}${v === 1 ? '' : 's'}`);
      live.textContent = `${parts.slice(0, -1).join(', ')} and ${parts[3]} until 9 November 2027.`;
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    let shakeX = 0, shakeY = 0;
    if (finaleOn && !reduce) {
      const s = Math.max(0, 1 - (T - finaleT) / 1.5) * 10;
      shakeX = (Math.random() - 0.5) * s; shakeY = (Math.random() - 0.5) * s;
      ctx.translate(shakeX, shakeY);
    }

    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, HZ);
    sky.addColorStop(0, '#0E0930'); sky.addColorStop(0.5, '#231566');
    sky.addColorStop(0.82, '#5A2388'); sky.addColorStop(0.96, '#C93A80'); sky.addColorStop(1, '#FF8F4A');
    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, HZ + 20);
    for (const s of stars) {
      const a = 0.35 + 0.35 * Math.sin(T * 1.7 + s.ph);
      ctx.fillStyle = `rgba(255,244,224,${a})`;
      ctx.fillRect(s.x * W, s.y * HZ, s.r, s.r);
    }

    // fireworks: update everything, draw the back layer now
    const fwEvery = finaleOn ? (reduce ? 0.7 : 0.16) : (mode === 'preview' ? 0.5 : (reduce ? 3.2 : 1.4));
    if (T > nextLaunch) {
      launch(finaleOn && R() < 0.5 ? 'front' : 'back');
      if (!finaleOn && !reduce && R() < 0.2) { launch('back'); launch('back'); }
      nextLaunch = T + fwEvery * (0.5 + R());
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += r.g * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      if (r.vy >= -20) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life > s.max) {
        if (s.crackle && sparks.length < SPARK_CAP) { s.crackle = false; s.max += 0.15; s.c = '#FFFFFF'; s.w = 3; continue; }
        sparks.splice(i, 1); continue;
      }
      s.px = s.x; s.py = s.y;
      const dr = Math.exp(-s.drag * dt);
      s.vx *= dr; s.vy = s.vy * dr + s.g * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
    const drawSparks = layer => {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (const s of sparks) {
        if (s.layer !== layer) continue;
        const a = 1 - s.life / s.max;
        ctx.globalAlpha = a * a;
        ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
        ctx.beginPath(); ctx.moveTo(s.px - (s.x - s.px) * 2, s.py - (s.y - s.py) * 2); ctx.lineTo(s.x, s.y); ctx.stroke();
      }
      for (const r of rockets) {
        if (r.layer !== layer) continue;
        ctx.globalAlpha = 0.9; ctx.strokeStyle = '#FFE2A8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.05, r.y - r.vy * 0.05); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    };
    ctx.globalCompositeOperation = 'lighter';
    for (let i = glows.length - 1; i >= 0; i--) {
      const g = glows[i]; g.life += dt;
      if (g.life > 0.8) { glows.splice(i, 1); continue; }
      const a = (1 - g.life / 0.8) * 0.22;
      const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
      const c = hex(g.c);
      gr.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
    drawSparks('back');

    // searchlights from the tower
    const tk = F / dist, tgy = HZ + CAMH * tk;
    const beams = finaleOn ? 4 : 2;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < beams; i++) {
      const ox = W / 2 + (i % 2 ? 1 : -1) * (i < 2 ? 30 : 16) * tk, oy = tgy - (i < 2 ? 86 : 92) * tk;
      const ang = -Math.PI / 2 + Math.sin(T * (0.35 + i * 0.12) + i * 1.7) * 0.75;
      const len = H * 1.6, wd = 0.07;
      const gr = ctx.createLinearGradient(ox, oy, ox + Math.cos(ang) * len, oy + Math.sin(ang) * len);
      gr.addColorStop(0, finaleOn ? 'rgba(255,230,170,.32)' : 'rgba(255,230,170,.13)'); gr.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(ang - wd) * len, oy + Math.sin(ang - wd) * len);
      ctx.lineTo(ox + Math.cos(ang + wd) * len, oy + Math.sin(ang + wd) * len);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // distant skyline
    ctx.fillStyle = '#3A1766';
    for (const b of skyline) ctx.fillRect(b.x * W, HZ - b.h * H * 0.05, b.w * W + 1, b.h * H * 0.05 + 1);

    // ground and road
    const gnd = ctx.createLinearGradient(0, HZ, 0, H);
    gnd.addColorStop(0, '#4A2470'); gnd.addColorStop(1, '#1C0F3E');
    ctx.fillStyle = gnd; ctx.fillRect(-20, HZ, W + 40, H - HZ + 20);
    const band = 6;
    for (let z = Math.floor((camZ + 0.4) / band) * band; z < ZC; z += band) {
      const z0 = Math.max(z, camZ + 0.4), z1 = z + band;
      const a = P(-9, 0, z0), b = P(9, 0, z0), c = P(9, 0, z1), d = P(-9, 0, z1);
      if (!a || !c) continue;
      const f = fogOf(z0 - camZ);
      ctx.fillStyle = fogc((z / band) % 2 ? [66, 34, 104] : [56, 28, 92], f);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill();
    }
    for (const sp of specks) {
      const dz = sp.z - camZ;
      if (dz < 1 || dz > 150) continue;
      const q = P(sp.x, 0, sp.z), s = Math.max(0.8, 0.14 * q[2]);
      ctx.fillStyle = sp.c; ctx.globalAlpha = 0.75 - dz / 220;
      ctx.fillRect(q[0] - s, q[1] - s * 0.3, s * 2, s * 0.6);
    }
    ctx.globalAlpha = 1;

    // tower
    const tw = drawTower(bd, bd.rem);

    // shockwave rings around the dial
    if (finaleOn && T > nextRing) { rings.push({ r: 1, life: 0 }); nextRing = T + (reduce ? 6 : 3.75); }
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i]; rg.life += dt;
      if (rg.life < 0) continue;
      if (rg.life > 1.4) { rings.splice(i, 1); continue; }
      const k = rg.life / 1.4;
      ctx.strokeStyle = CONFETTI[i % 6]; ctx.globalAlpha = 1 - k;
      ctx.lineWidth = tw.dr * 0.06 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(tw.cx, tw.dcy, tw.dr * (1 + k * 2.2), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // buildings (they line the street, so they always sit behind the parade)
    const bs = buildings.filter(b => b.z1 > camZ + 0.35).sort((a, b) => b.z0 - a.z0);
    for (const b of bs) drawBuilding(b);

    // depth-sorted street: lamps, bunting, floats, balloons, people
    const items = [];
    const span = dist - 12;
    for (const l of lamps) if (l.z > camZ + 0.5) items.push({ z: l.z, f: () => drawLamp(l) });
    for (const b of buntings) if (b.z > camZ + 0.5) items.push({ z: b.z, f: () => drawBunting(b) });
    for (const fl of floats) { const z = camZ + 4 + fl.u * span; items.push({ z: z + 2, f: () => drawFloat(fl, z, fogOf(z - camZ)) }); }
    for (const b of balloons) { const z = camZ + 4 + b.u * span; items.push({ z, f: () => drawBalloon(b, z, fogOf(z - camZ)) }); }
    for (const m of people) {
      const z = camZ + 3.4 + m.u * span;
      items.push({ z, f: () => { const q = P(m.x, 0, z); if (q) drawPerson(m, q[0], q[1], q[2], fogOf(q[3])); } });
    }
    items.sort((a, b) => b.z - a.z);
    for (const it of items) it.f();

    // front fireworks layer
    drawSparks('front');

    // confetti
    const want = finaleOn ? (reduce ? 70 : 340) : mode === 'preview' ? (reduce ? 40 : 160) : (reduce ? 20 : 70);
    if (confetti.length < want) addConfetti(Math.min(6, want - confetti.length), false);
    const g = H * 0.9;
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy = Math.min(c.vy + g * dt, 90 + (c.w % 3) * 15);
      c.vx *= Math.exp(-1.6 * dt);
      c.x += (c.vx + Math.sin(T * c.fr + c.ph) * 35) * dt; c.y += c.vy * dt;
      c.rot += c.vr * dt;
      if (c.y > H + 30) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.scale(Math.cos(T * c.fr + c.ph), 1);
      ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    // flash
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,244,224,${flash * 0.6})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
      flash = Math.max(0, flash - dt * 1.4);
    }

    requestAnimationFrame(frame);
  }

  if (document.fonts && document.fonts.load) {
    document.fonts.load('800 40px "Big Shoulders Display"');
    document.fonts.load('700 20px "Bricolage Grotesque"');
  }
  requestAnimationFrame(frame);

  // If the real moment has already passed, the celebration just keeps going.
  if (realNow() >= TARGET) finaleBtn.hidden = true;
})();
</script>
</body>
</html>
