<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parade to Zero</title>
<meta name="description" content="You're in the middle of a parade marching toward a giant clock that counts down to 9 November 2027.">
<meta name="theme-color" content="#1A1150">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1A1150;
    --deep: #0E0930;
    --magenta: #E63B8A;
    --marigold: #FFB31A;
    --teal: #12B5A6;
    --paper: #FFF4E0;
    --ink: #1A1150;
    --display: "Big Shoulders Display", "Impact", sans-serif;
    --text: "Bricolage Grotesque", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--night);
    color: var(--paper);
    font-family: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Always-readable countdown, top of the screen */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 34px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: linear-gradient(to bottom, rgba(14, 9, 48, .92), rgba(14, 9, 48, .7) 55%, rgba(14, 9, 48, 0));
    pointer-events: none;
  }
  .cells { display: flex; gap: clamp(10px, 3.2vw, 34px); align-items: flex-start; }
  .cell { display: flex; flex-direction: column; align-items: center; min-width: clamp(44px, 9vw, 92px); }
  .cell b {
    font: 800 clamp(38px, 7.4vw, 76px)/.88 var(--display);
    font-variant-numeric: tabular-nums; letter-spacing: .01em; color: var(--paper);
    text-shadow: 0 2px 0 var(--magenta), 0 0 22px rgba(14, 9, 48, .9);
  }
  .cell span { font: 700 clamp(11px, 1.5vw, 14px)/1.2 var(--text); color: var(--marigold); margin-top: 5px; }
  .route { display: flex; align-items: center; gap: 12px; font: 700 13px/1.2 var(--text);
    text-shadow: 0 1px 2px rgba(14, 9, 48, .9); }
  .track { position: relative; width: clamp(90px, 18vw, 180px); height: 4px; border-radius: 2px; background: rgba(255, 244, 224, .25); }
  .track .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--teal), var(--marigold), var(--magenta)); }
  .track .goal { position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--paper); box-shadow: 0 0 0 3px var(--magenta); }

  /* Controls */
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(20px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    width: calc(100vw - 32px);
  }
  button {
    font: 800 16px/1 var(--text);
    min-height: 48px; padding: 0 22px; border-radius: 999px; cursor: pointer;
    border: 2px solid transparent; letter-spacing: .01em;
    transition: transform .12s ease, background-color .2s ease;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .primary { background: var(--marigold); color: var(--ink); box-shadow: 0 6px 0 #B9740A, 0 10px 24px rgba(0,0,0,.35); }
  .primary:hover { background: #FFC447; }
  .primary:active { box-shadow: 0 2px 0 #B9740A; transform: translateY(4px); }
  .ghost { background: rgba(26, 17, 80, .6); color: var(--paper); border-color: rgba(255, 244, 224, .55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ghost:hover { border-color: var(--paper); }
  .ghost[aria-pressed="true"] { border-color: var(--teal); }
  [hidden] { display: none !important; }

  /* Finale headline */
  .finale-text {
    position: fixed; left: 0; right: 0; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 76px);
    text-align: center; padding: 0 16px; pointer-events: none;
  }
  .finale-text h2 {
    margin: 0; font: 900 clamp(46px, 9.5vw, 132px)/.9 var(--display); letter-spacing: .01em;
    color: var(--paper);
    text-shadow: 3px 3px 0 var(--magenta), 6px 6px 0 var(--teal), 0 0 40px rgba(255, 179, 26, .6);
  }
  .finale-text p { margin: 14px 0 0; font: 700 clamp(16px, 2.2vw, 22px)/1.3 var(--text);
    text-shadow: 0 1px 3px rgba(26,17,80,.9); }
  .finale-text.show h2 { animation: pop 900ms cubic-bezier(.2, 1.6, .4, 1) both; }
  .finale-text.show p { animation: rise 700ms 400ms ease-out both; }
  @keyframes pop { from { transform: scale(.3) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .finale-text.show h2, .finale-text.show p { animation: none; }
    button { transition: none; }
  }
  @media (max-width: 520px) {
    button { font-size: 15px; padding: 0 18px; }
    .route { font-size: 12px; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">Countdown to 9 November 2027</h1>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="hud" id="hud" aria-hidden="true">
    <div class="cells">
      <div class="cell"><b id="hMo">00</b><span id="lMo">months</span></div>
      <div class="cell"><b id="hD">00</b><span id="lD">days</span></div>
      <div class="cell"><b id="hH">00</b><span id="lH">hours</span></div>
      <div class="cell"><b id="hM">00</b><span id="lM">minutes</span></div>
      <div class="cell"><b id="hS">00</b><span id="lS">seconds</span></div>
    </div>
    <div class="route">
      <span id="routeText">Day 1 of 365 on the parade route</span>
      <div class="track"><span class="fill" id="routeFill"></span><span class="goal"></span></div>
    </div>
  </div>

  <div class="finale-text" id="finaleText" hidden>
    <h2>It’s 9 November 2027</h2>
    <p id="finaleSub">The parade made it to the clock.</p>
  </div>

  <div class="controls">
    <button class="primary" id="finaleBtn" type="button">Skip to the finale</button>
    <button class="ghost" id="replayBtn" type="button" hidden>Watch again</button>
    <button class="ghost" id="soundBtn" type="button" aria-pressed="false">Turn sound on</button>
  </div>

  <p class="sr-only" id="live" aria-live="polite"></p>
  <noscript><p style="position:fixed;inset:auto 16px 16px;font:700 18px system-ui">This countdown needs JavaScript to run.</p></noscript>

<script>
(() => {
  'use strict';

  /* ---------------------------------------------------------------
     Time
     --------------------------------------------------------------- */
  const TARGET = new Date(2027, 10, 9, 0, 0, 0).getTime();   // 9 Nov 2027, local midnight
  const START  = new Date(2026, 10, 9, 0, 0, 0).getTime();   // parade sets off a year earlier
  const TOTAL_DAYS = Math.round((TARGET - START) / 864e5);

  // Optional test hook: ?at=2027-11-08T23:59:50 pretends it is that moment.
  let offset = 0;
  const at = new URLSearchParams(location.search).get('at');
  if (at && !isNaN(Date.parse(at))) offset = Date.parse(at) - Date.now();
  const realNow = () => Date.now() + offset;

  function addMonths(d, n) {
    const r = new Date(d.getTime()), day = r.getDate();
    r.setDate(1); r.setMonth(r.getMonth() + n);
    const dim = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
    r.setDate(Math.min(day, dim));
    return r;
  }
  function addDays(d, n) { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; }

  // Calendar-correct months and days, then hours/minutes/seconds.
  function breakdown(nowMs) {
    const rem = TARGET - nowMs;
    if (rem <= 0) return { mo: 0, d: 0, h: 0, m: 0, s: 0, rem: 0 };
    const from = new Date(nowMs);
    let mo = (2027 - from.getFullYear()) * 12 + (10 - from.getMonth());
    while (mo > 0 && addMonths(from, mo).getTime() > TARGET) mo--;
    let anchor = addMonths(from, mo), d = 0;
    while (addDays(anchor, d + 1).getTime() <= TARGET) d++;
    anchor = addDays(anchor, d);
    let r = Math.floor((TARGET - anchor.getTime()) / 1000);
    const h = Math.floor(r / 3600); r -= h * 3600;
    const m = Math.floor(r / 60); const s = r - m * 60;
    return { mo, d, h, m, s, rem };
  }

  /* ---------------------------------------------------------------
     Setup
     --------------------------------------------------------------- */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, F = 1, maxDPR = 2, vignette = null;

  function resize() {
    DPR = Math.min(maxDPR, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    F = Math.min(H * 0.9, W * 1.6);
    vignette = document.createElement('canvas'); vignette.width = vignette.height = 128;
    const g = vignette.getContext('2d');
    const gr = g.createRadialGradient(64, 58, 30, 64, 64, 92);
    gr.addColorStop(0, 'rgba(10,6,36,0)'); gr.addColorStop(1, 'rgba(10,6,36,.62)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }
  window.addEventListener('resize', resize);
  resize();

  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const R = rng(20271109);
  const pick = a => a[Math.floor(R() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const TAU = Math.PI * 2;
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const HAZE = [104, 48, 148];
  const fogc = (c, f, a = 1) =>
    `rgba(${(c[0] + (HAZE[0] - c[0]) * f) | 0},${(c[1] + (HAZE[1] - c[1]) * f) | 0},${(c[2] + (HAZE[2] - c[2]) * f) | 0},${a})`;

  const C = {
    marigold: hex('#FFB31A'), magenta: hex('#E63B8A'), teal: hex('#12B5A6'),
    paper: hex('#FFF4E0'), violet: hex('#7C5CFF'), flame: hex('#FF5A36'), ink: hex('#1A1150'),
    gold: hex('#FFD36B'),
  };
  const COSTUME = [C.marigold, C.magenta, C.teal, C.violet, C.flame, C.paper];
  const PANTS = ['#2B1B5C', '#12345A', '#4A1240', '#1E1E3F', '#F2EAD8'].map(hex);
  const SKIN = ['#F2C7A5', '#D9A07A', '#B97A55', '#8D5A3B', '#5E3A26'].map(hex);
  const HAIR = ['#1B1210', '#3A2416', '#6B3E1E', '#111122', '#C9902E', '#E63B8A'].map(hex);
  const CONFETTI = ['#FFB31A', '#E63B8A', '#12B5A6', '#FFF4E0', '#8C6BFF', '#FF5A36'];

  // Soft light sprites (drawn additively, much cheaper than live gradients)
  function makeGlow(rgb) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    // low-poly light: stacked hard-edged polygons instead of a soft falloff
    const ring = (r, n, rot, a) => {
      g.fillStyle = `rgba(${rgb},${a})`; g.beginPath();
      for (let i = 0; i < n; i++) { const t = rot + i * TAU / n; g.lineTo(32 + Math.cos(t) * r, 32 + Math.sin(t) * r); }
      g.closePath(); g.fill();
    };
    ring(31, 8, 0.39, 0.09); ring(21, 8, 0, 0.15); ring(11.5, 6, 0.52, 0.32); ring(5.5, 6, 0, 1);
    return c;
  }

  /* Low-poly helpers */
  function poly(x, y, r, n, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const a = rot + i * TAU / n; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    ctx.closePath();
  }
  // a faceted "gem": a fan of triangles around an off-centre peak, each flat-shaded by its angle to the light
  function gem(x, y, r, n, rot, c, f, c2) {
    const px = x - r * 0.18, py = y - r * 0.24;
    for (let i = 0; i < n; i++) {
      const a0 = rot + i * TAU / n, a1 = a0 + TAU / n, sh = 0.78 + 0.3 * Math.cos((a0 + a1) / 2 + 2.2);
      const base = c2 && i % 2 ? c2 : c;
      const col = fogc([Math.min(255, base[0] * sh), Math.min(255, base[1] * sh), Math.min(255, base[2] * sh)], f);
      ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(x + Math.cos(a0) * r, y + Math.sin(a0) * r); ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  // a jittered triangle mesh coloured from a ramp: the faceted sky and ground
  function buildMesh(cols, rows, stops, seed) {
    const r = rng(seed), pts = [], tris = [];
    for (let j = 0; j < rows.length; j++) for (let i = 0; i <= cols; i++) {
      const edgeX = i === 0 || i === cols, edgeY = j === 0 || j === rows.length - 1;
      const dy = edgeY ? 0 : (r() - 0.5) * 0.55 * Math.min(rows[j] - rows[j - 1], rows[j + 1] - rows[j]);
      pts.push([i / cols + (edgeX ? 0 : (r() - 0.5) * 0.6 / cols), rows[j] + dy]);
    }
    const col = t => {
      let k = 0; while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
      const a = stops[k], b = stops[k + 1], u = clamp((t - a[0]) / (b[0] - a[0]), 0, 1);
      return `rgb(${(a[1][0] + (b[1][0] - a[1][0]) * u) | 0},${(a[1][1] + (b[1][1] - a[1][1]) * u) | 0},${(a[1][2] + (b[1][2] - a[1][2]) * u) | 0})`;
    };
    for (let j = 0; j < rows.length - 1; j++) for (let i = 0; i < cols; i++) {
      const a = pts[j * (cols + 1) + i], b = pts[j * (cols + 1) + i + 1], c = pts[(j + 1) * (cols + 1) + i], d = pts[(j + 1) * (cols + 1) + i + 1];
      const pair = (i + j) % 2 ? [[a, b, c], [b, d, c]] : [[a, b, d], [a, d, c]];
      for (const t of pair) {
        const cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        tris.push([t[0][0], t[0][1], t[1][0], t[1][1], t[2][0], t[2][1], col(clamp(cy + (r() - 0.5) * 0.09, 0, 1))]);
      }
    }
    return tris;
  }
  function drawMesh(m, x, y, w, h) {
    ctx.lineWidth = 1; ctx.lineJoin = 'round';
    for (const t of m) {
      ctx.fillStyle = t[6]; ctx.strokeStyle = t[6];
      ctx.beginPath(); ctx.moveTo(x + t[0] * w, y + t[1] * h); ctx.lineTo(x + t[2] * w, y + t[3] * h); ctx.lineTo(x + t[4] * w, y + t[5] * h);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  const GL = {
    warm: makeGlow('255,196,110'), white: makeGlow('255,244,224'), mag: makeGlow('230,59,138'),
    teal: makeGlow('18,181,166'), gold: makeGlow('255,179,26'), violet: makeGlow('140,107,255'),
  };
  const GLK = [GL.gold, GL.mag, GL.teal, GL.white, GL.violet, GL.warm];
  function glow(sp, x, y, r, a) { ctx.globalAlpha = a; ctx.drawImage(sp, x - r, y - r, r * 2, r * 2); }
  const SKY = buildMesh(10, [0, 0.2, 0.4, 0.57, 0.71, 0.83, 0.92, 1],
    [[0, hex('#0B0729')], [0.45, hex('#1F1260')], [0.8, hex('#5A2388')], [0.94, hex('#C93A80')], [1, hex('#FF8F4A')]], 11);
  const GND = buildMesh(9, [0, 0.1, 0.28, 0.58, 1],
    [[0, hex('#5A2A80')], [0.25, hex('#341A5E')], [1, hex('#190D38')]], 23);

  /* World layout (units ≈ metres). You ride a float down a wide boulevard toward a colossal clock tower. */
  const TS = 3;                    // tower scale
  const ZC = 720;                  // tower z
  const D0 = 630, D1 = 324;        // distance to the tower at the start / at zero
  const CAMH = 3;
  const YC = 40 * TS, RC = 36 * TS; // dial centre height and radius
  const ROADW = 12, SIDE = 20;     // road half-width, building line
  const LOOP = 240;                // the parade column repeats over this length
  const END_Z = ZC - 170;          // the boulevard opens into a plaza here

  // Buildings: kept low so nothing ever cuts into the clock face
  const buildings = [];
  for (const side of [-1, 1]) {
    let z = -20;
    while (z < END_Z) {
      const len = 9 + R() * 11, h = 7 + R() * 3.5;
      const wins = [];
      const cols = Math.floor((len - 1) / 2.6), rows = Math.max(1, Math.floor((h - 4.6) / 2.4));
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
        if (R() < 0.62) wins.push({ c, r, col: R() < 0.7 ? hex('#FFD27A') : pick([C.magenta, C.teal, C.paper]) });
      }
      buildings.push({ side, z0: z, z1: z + len, h, col: hex(pick(['#3A1B6E', '#4A1D6B', '#2E1E66', '#55205F', '#3B2A78'])),
        wins, awn: pick(COSTUME), awn2: pick([C.paper, C.ink]), neon: R() < 0.4 ? Math.floor(R() * 6) : -1, shops: Math.floor(len / 3.4) });
      z += len + 0.5;
    }
  }
  const lamps = [];
  for (let z = 6; z < END_Z; z += 14) { lamps.push({ x: -12.8, z, i: lamps.length }); lamps.push({ x: 12.8, z: z + 7, i: lamps.length }); }
  const garlands = [];
  for (const l of lamps) if (l.z + 14 < END_Z) garlands.push({ x: l.x, z0: l.z, off: l.i });
  const specks = [];
  for (let i = 0; i < 900; i++) specks.push({ x: (R() * 2 - 1) * ROADW, z: R() * ZC, c: pick(CONFETTI) });

  /* The parade column: blocks of acts that repeat along the route */
  const MOVES = ['wave', 'wave', 'pump', 'clap', 'twirl', 'march'];
  const HATS = ['cone', 'feather', 'crown', 'none', 'feather', 'cone'];
  const people = [], floats = [], balloons = [], dragons = [];
  const lane = x => Math.abs(x) < 2.2 ? (x < 0 ? -1 : 1) * (2.2 + R() * 1.6) : x;   // keep your own lane clear
  function mk(wz, x, o) {
    return Object.assign({
      wz, x: lane(x), h: 1.65 + R() * 0.3, role: 'dancer', move: pick(MOVES),
      body: pick(COSTUME), trim: pick(COSTUME), pants: pick(PANTS), skin: pick(SKIN), hair: pick(HAIR),
      hat: pick(HATS), skirt: R() < 0.45, sp: 3.2 + R() * 2.2, ph: R() * TAU, jump: 0.6 + R() * 0.8,
      flag: pick(COSTUME), seed: Math.floor(R() * 6),
    }, o);
  }
  const scatter = (z0, n, o, zr = 18) => { for (let i = 0; i < n; i++) people.push(mk(z0 + 1 + R() * zr, (R() * 2 - 1) * (ROADW - 1), typeof o === 'function' ? o() : o)); };
  const BLOCKS = ['band', 'dancers', 'float', 'dragon', 'balloon', 'stilts'];
  for (let b = 0; b < LOOP / 20; b++) {
    const z0 = b * 20, kind = BLOCKS[b % 6], sideSign = (b % 2 ? 1 : -1);
    if (kind === 'band') {
      const body = COSTUME[b % 5], trim = C.paper, pants = PANTS[b % 4];
      for (let r = 0; r < 6; r++) for (const cx of [-9.4, -7, -4.6, 4.6, 7, 9.4]) {
        people.push(mk(z0 + 2 + r * 2.6, cx, { role: r < 2 ? 'drummer' : r < 4 ? 'brass' : 'flag', move: 'march', hat: 'shako',
          body, trim, pants, skirt: false, sp: 4.2, ph: 0, h: 1.8, flag: COSTUME[(b + r) % 5], horn: r === 3 ? 'sousa' : 'trumpet' }));
      }
      scatter(z0, 6, { role: 'pom' });
    } else if (kind === 'dancers') {
      scatter(z0, 16, () => ({ role: pick(['dancer', 'pom', 'ribbon', 'dancer']), hat: 'feather' }));
      scatter(z0, 12, () => ({ role: pick(['dancer', 'ribbon']) }));
    } else if (kind === 'float') {
      floats.push({ wz: z0 + 8, x: sideSign * 8.5, body: COSTUME[b % 5], top: COSTUME[(b + 2) % 5], ph: R() * TAU,
        kind: ['pinwheel', 'cake', 'arch'][floats.length % 3],
        riders: [-1.7, 0, 1.7].map(dx => ({ dx, m: mk(0, 5, { role: 'dancer', move: pick(['wave', 'clap', 'pump']), hat: 'feather' }) })) });
      for (let i = 0; i < 20; i++) people.push(mk(z0 + 1 + R() * 18, -sideSign * (2.5 + R() * 8.5), { role: pick(['flag', 'dancer', 'pom']) }));
      for (let i = 0; i < 4; i++) people.push(mk(z0 + 2 + i * 4, sideSign * 4.4, { role: 'ribbon', move: 'twirl' }));
    } else if (kind === 'dragon') {

  const A = { ac: null, master: null, noise: null, on: false, next: 0, step: 0, lastBoom: 0 };

    72,0,72,0,76,0,79,0,84,0,0,0,79,0,76,0,
    77,0,77,0,81,0,84,0,86,0,0,0,84,0,0,0,
    76,0,76,0,79,0,84,0,88,0,0,0,86,0,84,0,

  /* ---------------------------------------------------------------

  function simNow(now) {

  /* ---------------------------------------------------------------

     --------------------------------------------------------------- */
  function drawPerson(m, sx, sy, s, f) {

    const stilt = m.role === 'stilt';

        ctx.fillStyle = fogc(C.gold, f * 0.7);
        ctx.beginPath(); ctx.arc(shx + 0.52 * s, headY - (0.17 + tilt) * s, 0.1 * s, 0, TAU); ctx.fill();
      }
    } else if (m.role === 'flag') {
      arm(-1, down + 0.35 + sn * 0.2, 0.3);
      arm(1, up + 0.25, -0.2);
      const pa = up + Math.sin(ph * 0.9) * (0.5 * E);
      const tx = rhx + Math.cos(pa) * 1.25 * s, ty = rhy + Math.sin(pa) * 1.25 * s;
      ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, lw * 0.45);
      ctx.beginPath(); ctx.moveTo(rhx - Math.cos(pa) * 0.3 * s, rhy - Math.sin(pa) * 0.3 * s); ctx.lineTo(tx, ty); ctx.stroke();
      const nx = -Math.sin(pa), ny = Math.cos(pa), wv = Math.sin(T * 7 + m.ph) * 0.1 * s;
      const bx = rhx + Math.cos(pa) * 0.65 * s, by = rhy + Math.sin(pa) * 0.65 * s;
      ctx.fillStyle = fogc(m.flag, f);
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo(tx + nx * 0.4 * s, ty + ny * 0.4 * s - wv, tx + nx * 0.8 * s, ty + ny * 0.8 * s + wv);
      ctx.lineTo(bx + nx * 0.8 * s, by + ny * 0.8 * s + wv);
      ctx.quadraticCurveTo(bx + nx * 0.4 * s, by + ny * 0.4 * s - wv, bx, by);
      ctx.closePath(); ctx.fill();
    } else if (m.role === 'hold') {
      arm(-1, up - 0.25, 0.1); arm(1, up + 0.25, -0.1);
    } else if (m.role === 'juggler') {
      arm(-1, down - 1.0 + Math.sin(ph * 2) * 0.4, -1.2); arm(1, down + 1.0 - Math.sin(ph * 2 + 2) * 0.4, 1.2);
      for (let i = 0; i < 3; i++) {
        const u = ((T * 1.1 + i / 3 + m.ph) % 1), bx = shx + (u * 2 - 1) * 0.42 * s * (i % 2 ? 1 : -1);
        const by = shY - 0.1 * s - Math.sin(u * Math.PI) * 1.15 * s;
        ctx.fillStyle = fogc(COSTUME[(i + m.seed) % 5], f * 0.6);
        ctx.beginPath(); ctx.arc(bx, by, 0.085 * s, 0, TAU); ctx.fill();
      }
    } else {
      const mv = m.move;
      if (mv === 'pump') {
        for (let sd = -1; sd <= 1; sd += 2) { const e = 0.5 + 0.5 * Math.sin(ph * 2 + (sd > 0 ? Math.PI : 0)); arm(sd, up + sd * 0.4, sd * 1.9 * (1 - e)); }
      } else if (mv === 'clap') {
        const e = 0.5 + 0.5 * Math.cos(ph * 2);
        arm(-1, up - 0.25 - e * 0.8, 0.5 + e * 0.6); arm(1, up + 0.25 + e * 0.8, -0.5 - e * 0.6);
      } else if (mv === 'twirl') {
        arm(-1, Math.PI + 0.35 + sn * 0.2, 0.3); arm(1, -0.35 - sn * 0.2, -0.3);
      } else if (mv === 'march') {
        arm(-1, down + 0.25 - sn * 0.5, -0.4 * (0.5 - sn * 0.5)); arm(1, down - 0.25 - sn * 0.5, 0.4 * (0.5 + sn * 0.5));
      } else {
        const amp = 0.5 * E;
        arm(-1, up - 0.7 - Math.sin(ph * 2) * amp, -0.4); arm(1, up + 0.7 + Math.sin(ph * 2 + 1.3) * amp, 0.4);
      }
      if (m.role === 'pom') {
        ctx.fillStyle = fogc(m.trim, f);
        ctx.beginPath(); ctx.arc(lhx, lhy, 0.13 * s, 0, TAU); ctx.arc(rhx, rhy, 0.13 * s, 0, TAU); ctx.fill();
        if (full) { ctx.fillStyle = fogc(C.paper, f, 0.5); ctx.beginPath(); ctx.arc(lhx - 0.03 * s, lhy - 0.04 * s, 0.05 * s, 0, TAU); ctx.arc(rhx - 0.03 * s, rhy - 0.04 * s, 0.05 * s, 0, TAU); ctx.fill(); }
      } else if (m.role === 'ribbon') {
        ctx.strokeStyle = fogc(m.trim, f); ctx.lineWidth = Math.max(1, lw * 0.55);
        ctx.beginPath(); ctx.moveTo(rhx, rhy);
        const n = full ? 14 : 7, dir = m.seed % 2 ? 1 : -1;
        for (let i = 1; i <= n; i++) {
          const u = i / n;
          ctx.lineTo(rhx + dir * u * 1.5 * s + Math.cos(T * 5 + i * 0.6 + m.ph) * 0.08 * s,
            rhy - u * 0.5 * s + Math.sin(T * 9 - i * 0.9 + m.ph) * 0.3 * s * u);
        }
        ctx.stroke();
      }
    }

    // head, hair, hat
    const R6 = hr * 1.12;
    ctx.fillStyle = fogc(m.skin, f);
    poly(shx, headY, R6, 6, 0); ctx.fill();
    ctx.fillStyle = 'rgba(14,6,48,.18)';
    ctx.beginPath(); ctx.moveTo(shx, headY - R6 * 0.87); ctx.lineTo(shx + R6 * 0.5, headY - R6 * 0.87); ctx.lineTo(shx + R6, headY); ctx.lineTo(shx + R6 * 0.5, headY + R6 * 0.87); ctx.lineTo(shx, headY + R6 * 0.87); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fogc(m.hair, f);
    ctx.beginPath(); ctx.moveTo(shx - R6, headY); ctx.lineTo(shx - R6 * 0.5, headY - R6 * 0.87); ctx.lineTo(shx + R6 * 0.5, headY - R6 * 0.87); ctx.lineTo(shx + R6, headY); ctx.lineTo(shx + R6 * 0.55, headY - R6 * 0.2); ctx.lineTo(shx - R6 * 0.55, headY - R6 * 0.2); ctx.closePath(); ctx.fill();
    if (m.hat === 'cone') {
      ctx.fillStyle = fogc(m.trim, f);
      ctx.beginPath(); ctx.moveTo(shx - hr * 0.85, headY - hr * 0.6); ctx.lineTo(shx + hr * 0.85, headY - hr * 0.6);
      ctx.lineTo(shx + hr * 0.15, headY - hr * 2.9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = fogc(C.paper, f);
      ctx.beginPath(); ctx.arc(shx + hr * 0.15, headY - hr * 2.9, hr * 0.32, 0, TAU); ctx.fill();
    } else if (m.hat === 'shako') {
      ctx.fillStyle = fogc(C.ink, f * 0.7);
      ctx.fillRect(shx - hr * 0.85, headY - hr * 2.3, hr * 1.7, hr * 1.8);
      ctx.fillStyle = fogc(m.trim, f);
      ctx.fillRect(shx - hr * 0.85, headY - hr * 0.75, hr * 1.7, hr * 0.25);
      ctx.beginPath(); ctx.ellipse(shx, headY - hr * 2.8, hr * 0.35, hr * 0.8, 0, 0, TAU); ctx.fill();
    } else if (m.hat === 'crown') {
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = fogc(COSTUME[(i + m.seed) % 6], f);
        ctx.beginPath(); ctx.arc(shx + (i - 2) * hr * 0.45, headY - hr * 0.95 - (i % 2) * hr * 0.15, hr * 0.28, 0, TAU); ctx.fill();
      }
    }
  }

  // Spectators behind the barriers: cheap, but they cheer
  function drawSpectator(i, row, side, z) {
    const x = side * (14.3 + row * 1.6 + hash(i * 3.1 + row) * 0.5);
    const q = P(x, 0, z + hash(i + row * 7) * 0.6);
    if (!q) return;
    const s = q[2], f = fogOf(q[3]), h1 = hash(i * 1.7 + row * 13 + side);
    const cheer = Math.sin(T * (3 + h1 * 3) * (finaleOn ? 1.5 : 1) + h1 * 20);
    const hop = Math.max(0, cheer) * (finaleOn ? 0.3 : 0.1) * s;
    const hgt = (1.55 + h1 * 0.3) * s, top = q[1] - hgt - hop;
    ctx.fillStyle = fogc(COSTUME[(i + row) % 6 | 0], Math.min(0.9, f + 0.25));
    ctx.fillRect(q[0] - 0.22 * s, top + 0.3 * s, 0.44 * s, hgt - 0.3 * s);
    ctx.fillStyle = fogc(SKIN[(i * 7 + row) % 5], Math.min(0.9, f + 0.15));
    ctx.fillRect(q[0] - 0.13 * s, top, 0.26 * s, 0.28 * s);
    if (s > 9 && h1 > 0.35) {
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, 0.08 * s); ctx.lineCap = 'round';
      const a = 0.5 + cheer * 0.35;
      ctx.beginPath();
      ctx.moveTo(q[0] - 0.2 * s, top + 0.38 * s); ctx.lineTo(q[0] - (0.2 + Math.sin(a) * 0.4) * s, top + 0.38 * s - Math.cos(a) * 0.5 * s);
      ctx.moveTo(q[0] + 0.2 * s, top + 0.38 * s); ctx.lineTo(q[0] + (0.2 + Math.sin(a) * 0.4) * s, top + 0.38 * s - Math.cos(a) * 0.5 * s);
      ctx.stroke();
    }
  }

  /* ---------------------------------------------------------------
     Parade pieces
     --------------------------------------------------------------- */
  function drawBalloon(b, z, f) {
    const sway = Math.sin(T * 0.7 + b.ph) * (finaleOn ? 0.7 : 0.35);
    const bob = Math.sin(T * 0.9 + b.ph) * (finaleOn ? 0.6 : 0.35);
    const c = P(b.x + sway, b.y + bob, z);
    if (!c) return;
    const [sx, sy, k] = c, r = b.r * k;
    if (r < 1) return;
    ctx.strokeStyle = fogc(C.paper, f, 0.7); ctx.lineWidth = Math.max(0.6, 0.035 * k);
    for (const h of b.handlers) {
      const g = P(b.x + h.dx, 0, z + h.dz);
      if (!g) continue;
      drawPerson(h.m, g[0], g[1], g[2], fogOf(g[3]));
      ctx.strokeStyle = fogc(C.paper, f, 0.7); ctx.lineWidth = Math.max(0.6, 0.035 * k);
      ctx.beginPath(); ctx.moveTo(sx, sy + r * 0.8); ctx.lineTo(g[0], g[1] - 2.0 * g[2]); ctx.stroke();
    }
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(sway * 0.08);
    if (b.kind === 'star') {
      ctx.rotate(Math.sin(T * 0.5 + b.ph) * 0.12);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.5 : r * 1.1;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = fogc(b.c1, f); ctx.fill();
      ctx.lineWidth = Math.max(1, r * 0.08); ctx.lineJoin = 'round'; ctx.strokeStyle = fogc(b.c2, f); ctx.stroke();
      // facets: every other point-to-centre wedge sits in shade
      ctx.fillStyle = 'rgba(14,6,48,.2)';
      for (let i = 0; i < 10; i += 2) {
        const a0 = -Math.PI / 2 + (i * Math.PI) / 5, a1 = a0 + Math.PI / 5;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * r * 1.1, Math.sin(a0) * r * 1.1); ctx.lineTo(Math.cos(a1) * r * 0.5, Math.sin(a1) * r * 0.5); ctx.closePath(); ctx.fill();
      }
    } else if (b.kind === 'orb') {
      gem(0, 0, r, 9, T * 0.25 + b.ph, b.c1, f, b.c2);
    } else {
      const pts = [[0, -0.55], [-0.6, -0.15], [0.6, -0.15], [-0.35, 0.45], [0.35, 0.45], [0, 0.05]];
      pts.forEach(([px, py], i) => gem(px * r, py * r, r * 0.5, 6, i, COSTUME[(i + (b.ph * 2 | 0)) % 6], f));
    }
    ctx.restore();
  }

  function drawFloat(fl, z, f) {
    const x = fl.x;
    const a = P(x - 3, 0.3, z), b = P(x + 3, 0.3, z), d = P(x - 3, 2.2, z);
    const e = P(x + 3, 2.2, z + 5), g = P(x - 3, 2.2, z + 5), c = P(x + 3, 2.2, z);
    if (!a || !e) return;
    const k = a[2];
    // shadow and deck
    ctx.fillStyle = 'rgba(10,5,30,.4)';
    ctx.beginPath(); ctx.ellipse((a[0] + b[0]) / 2, a[1] + 0.25 * k, (b[0] - a[0]) * 0.56, 0.3 * k, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = fogc(fl.top, f);
    ctx.beginPath(); ctx.moveTo(d[0], d[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(e[0], e[1]); ctx.lineTo(g[0], g[1]); ctx.closePath(); ctx.fill();

    // centrepiece, kept low so it never rises into the clock
    const hub = P(x, 4.3, z + 2.6), foot = P(x, 2.2, z + 2.6);
    if (hub && foot) {
      const hk = hub[2];
      if (fl.kind === 'pinwheel') {
        ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, 0.12 * hk);
        ctx.beginPath(); ctx.moveTo(foot[0], foot[1]); ctx.lineTo(hub[0], hub[1]); ctx.stroke();
        const rr = 1.9 * hk, rot = T * (finaleOn ? 3.2 : rushing ? 2.4 : 1.2) + fl.ph;
        for (let i = 0; i < 8; i++) {
          const a0 = rot + (i * TAU) / 8;
          ctx.fillStyle = fogc(COSTUME[i % 6], f);
          ctx.beginPath(); ctx.moveTo(hub[0], hub[1]);
          ctx.lineTo(hub[0] + Math.cos(a0) * rr, hub[1] + Math.sin(a0) * rr);
          ctx.lineTo(hub[0] + Math.cos(a0 + 0.55) * rr * 0.55, hub[1] + Math.sin(a0 + 0.55) * rr * 0.55);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = fogc(C.paper, f);
        ctx.beginPath(); ctx.arc(hub[0], hub[1], rr * 0.12, 0, TAU); ctx.fill();
      } else if (fl.kind === 'cake') {
        const tiers = [[2.0, 1.1], [1.4, 1.0], [0.8, 0.9]];
        let y = 2.2;
        tiers.forEach(([hw, th], i) => {
          const yb = foot[1] - (y - 2.2) * hk, yt = yb - th * hk;
          ctx.fillStyle = fogc(i % 2 ? fl.body : C.paper, f);
          ctx.fillRect(foot[0] - hw * hk, yt, hw * 2 * hk, th * hk);
          ctx.fillStyle = fogc(C.magenta, f);
          const n = Math.round(hw * 4);
          for (let j = 0; j < n; j++) { ctx.beginPath(); ctx.arc(foot[0] - hw * hk + (j + 0.5) * (hw * 2 * hk / n), yt, hw * hk / n, 0, Math.PI); ctx.fill(); }
          y += th;
        });
        const ty = foot[1] - (y - 2.2) * hk;
        ctx.globalCompositeOperation = 'lighter';
        glow(GL.white, foot[0], ty - 0.3 * hk, (0.9 + Math.random() * 0.5) * hk, 0.9);
        ctx.strokeStyle = '#FFE9B0'; ctx.lineWidth = Math.max(1, 0.05 * hk); ctx.globalAlpha = 0.9;
        ctx.beginPath();
        for (let j = 0; j < 9; j++) { const a0 = Math.random() * TAU, rr = (0.3 + Math.random() * 0.8) * hk; ctx.moveTo(foot[0], ty - 0.3 * hk); ctx.lineTo(foot[0] + Math.cos(a0) * rr, ty - 0.3 * hk + Math.sin(a0) * rr); }
        ctx.stroke();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      } else {
        for (let i = 0; i <= 12; i++) {
          const a0 = Math.PI + (i / 12) * Math.PI, bobb = Math.sin(T * 2 + i + fl.ph) * 0.08;
          const bx = foot[0] + Math.cos(a0) * 2.5 * hk, by = foot[1] + Math.sin(a0) * (2.4 + bobb) * hk;
          gem(bx, by, 0.58 * hk, 6, i * 0.5, COSTUME[i % 6], f);
        }
      }
    }
    for (const rd of fl.riders) { const q = P(x + rd.dx, 2.2, z + 1.4); if (q) drawPerson(rd.m, q[0], q[1], q[2], fogOf(q[3])); }

    // front face with gradient, scalloped skirt, bulbs
    const top = d[1], bot = a[1];
    ctx.fillStyle = fogc(fl.body, f); ctx.fillRect(a[0], top, b[0] - a[0], bot - top);
    ctx.fillStyle = 'rgba(14,6,48,.28)';   // one hard diagonal facet instead of a gradient
    ctx.beginPath(); ctx.moveTo(a[0], bot); ctx.lineTo(b[0], top); ctx.lineTo(b[0], bot); ctx.closePath(); ctx.fill();
    const n = 8, wseg = (b[0] - a[0]) / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = fogc(i % 2 ? C.paper : fl.top, f);
      ctx.beginPath(); ctx.arc(a[0] + wseg * (i + 0.5), bot - 0.05 * k, wseg / 2, Math.PI, 0); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i <= 12; i++) {
      const on = ((i + Math.floor(T * 6)) % 3) === 0;
      glow(on ? GL.white : GL.gold, a[0] + (b[0] - a[0]) * i / 12, top + 0.14 * k, (on ? 0.42 : 0.22) * k, on ? 1 : 0.7);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  const DRAGON_N = 16;
  function drawDragonSeg(dg, i, z, f) {
    const x = dg.x + Math.sin(T * 2.2 - i * 0.55 + dg.ph) * 1.4;
    const y = 2.1 + Math.sin(T * 3 - i * 0.7 + dg.ph) * 0.3;
    const q = P(x, y, z), g = P(x, 0, z);
    if (!q || !g) return;
    const k = q[2], head = i === DRAGON_N - 1, r = (head ? 0.95 : i === 0 ? 0.35 : 0.5 + Math.sin(i * 0.4) * 0.12) * k;
    if (i % 2 === 0) {
      drawPerson(dg.carriers[(i / 2) % 8], g[0], g[1], g[2], fogOf(g[3]));
      ctx.strokeStyle = fogc(C.paper, f); ctx.lineWidth = Math.max(1, 0.05 * k);
      ctx.beginPath(); ctx.moveTo(g[0], g[1] - 1.9 * k); ctx.lineTo(q[0], q[1]); ctx.stroke();
    }
    // back fin
    ctx.fillStyle = fogc(dg.c2, f);
    ctx.beginPath(); ctx.moveTo(q[0] - r * 0.5, q[1] - r * 0.7); ctx.lineTo(q[0], q[1] - r * 1.7); ctx.lineTo(q[0] + r * 0.5, q[1] - r * 0.7); ctx.closePath(); ctx.fill();
    gem(q[0], q[1], r, head ? 8 : 6, i * 0.4, i % 2 ? dg.c1 : dg.c2, f);
    if (head) {
      ctx.fillStyle = fogc(dg.c1, f);
      for (let sd = -1; sd <= 1; sd += 2) {   // horns and whiskers
        ctx.beginPath(); ctx.moveTo(q[0] + sd * r * 0.4, q[1] - r * 0.7); ctx.lineTo(q[0] + sd * r * 1.2, q[1] - r * 1.9); ctx.lineTo(q[0] + sd * r * 0.85, q[1] - r * 0.4); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = fogc(C.flame, f); ctx.lineWidth = Math.max(1, r * 0.1); ctx.lineCap = 'round';
      ctx.beginPath();
      for (let sd = -1; sd <= 1; sd += 2) { ctx.moveTo(q[0] + sd * r * 0.9, q[1]); ctx.quadraticCurveTo(q[0] + sd * r * 1.8, q[1] + Math.sin(T * 4 + sd) * r * 0.5, q[0] + sd * r * 2.2, q[1] - r * 0.4); }
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glow(GL.gold, q[0], q[1], r * 2.2, 0.5);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  }

  /* ---------------------------------------------------------------
     Street furniture and buildings
     --------------------------------------------------------------- */
  function drawLamp(l) {
    const b = P(l.x, 0, l.z), t = P(l.x, 6, l.z);
    if (!b || !t) return;
    const f = fogOf(b[3]), k = b[2], sd = l.x < 0 ? -1 : 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = fogc(hex('#2A1A4E'), f); ctx.lineWidth = Math.max(1, 0.18 * k);
    ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(t[0], t[1]);
    ctx.moveTo(t[0] - 0.7 * k, t[1] + 0.25 * k); ctx.lineTo(t[0] + 0.7 * k, t[1] + 0.25 * k); ctx.stroke();
    // hanging banner on the street side
    if (k > 2.5) {
      const bx = t[0] - sd * 0.25 * k, bw = -sd * 1.15 * k, by = t[1] + 0.7 * k, bh = 2.3 * k;
      ctx.fillStyle = fogc(COSTUME[l.i % 5], f);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + bh);
      ctx.lineTo(bx + bw / 2, by + bh - 0.45 * k); ctx.lineTo(bx, by + bh); ctx.closePath(); ctx.fill();
      ctx.fillStyle = fogc(COSTUME[(l.i + 2) % 5], f);
      ctx.beginPath(); ctx.arc(bx + bw / 2, by + bh * 0.4, 0.3 * k, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let s2 = -1; s2 <= 1; s2 += 2) {
      glow(GL.warm, t[0] + s2 * 0.7 * k, t[1] + 0.05 * k, 1.9 * k, 0.55);
      glow(GL.white, t[0] + s2 * 0.7 * k, t[1] + 0.05 * k, 0.5 * k, 1);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function drawGarland(g) {
    ctx.strokeStyle = 'rgba(255,244,224,.55)';
    let prev = null;
    const f = fogOf(g.z0 + 7 - camZ);
    for (let j = 0; j <= 8; j++) {
      const t = j / 8, z = g.z0 + 14 * t, y = 6.1 - 1.4 * 4 * t * (1 - t);
      const q = P(g.x, y, z);
      if (!q) { prev = null; continue; }
      if (prev) {
        ctx.lineWidth = Math.max(0.6, 0.04 * q[2]);
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      }
      if (j > 0 && j < 8) {
        const a = P(g.x, y, z - 0.45), b = P(g.x, y, z + 0.45);
        if (a && b) {
          ctx.fillStyle = fogc(COSTUME[(j + g.off) % 6], f);
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
          ctx.lineTo(q[0] + Math.sin(T * 4 + j + g.off) * 0.12 * q[2], q[1] + 0.95 * q[2]); ctx.closePath(); ctx.fill();
        }
      }
      prev = q;
    }
  }

  function quad(a, b, c, d) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill(); }

  /* ---------------------------------------------------------------
     The clock tower
     --------------------------------------------------------------- */
  const pad = n => String(n).padStart(2, '0');
  const NAMES = [['month', 'months'], ['day', 'days'], ['hour', 'hours'], ['minute', 'minutes'], ['second', 'seconds']];

  function drawTower(bd, rem) {
    const k = (F / dist) * TS, cx = W / 2, gy = HZ + CAMH * F / dist;
    const X = x => cx + x * k, Y = y => gy - y * k;
    const dcy = Y(40), dr = 36 * k;

    // sunburst behind the tower

    const rayLen = dr * 3.4, rot = T * (finaleOn ? 0.12 : 0.025);
    const g1 = ctx.createRadialGradient(cx, dcy, dr, cx, dcy, rayLen);
    g1.addColorStop(0, finaleOn ? 'rgba(255,190,80,.34)' : 'rgba(255,179,26,.16)'); g1.addColorStop(1, 'rgba(255,179,26,0)');
    const g2 = ctx.createRadialGradient(cx, dcy, dr, cx, dcy, rayLen);
    g2.addColorStop(0, finaleOn ? 'rgba(230,59,138,.3)' : 'rgba(230,59,138,.14)'); g2.addColorStop(1, 'rgba(230,59,138,0)');

      ctx.moveTo(X(sd * 42), Y(4)); ctx.lineTo(X(sd * 68), Y(4)); ctx.lineTo(X(sd * 68), Y(34)); ctx.lineTo(X(sd * 60), Y(34));
      ctx.lineTo(X(sd * 60), Y(46)); ctx.lineTo(X(sd * 52), Y(46)); ctx.lineTo(X(sd * 52), Y(54)); ctx.lineTo(X(sd * 42), Y(54));
      ctx.closePath(); ctx.fill();
    }
    for (let sd = -1; sd <= 1; sd += 2) for (let i = 0; i < 3; i++) {
      const ax = sd * (48.5 + i * 6.5);
      ctx.fillStyle = '#FFD27A';
      ctx.beginPath(); ctx.moveTo(X(ax - 2), Y(6)); ctx.lineTo(X(ax - 2), Y(19)); ctx.lineTo(X(ax), Y(23)); ctx.lineTo(X(ax + 2), Y(19)); ctx.lineTo(X(ax + 2), Y(6)); ctx.closePath(); ctx.fill();
    }

    // main shaft
    ctx.fillStyle = '#4A1C80';
    ctx.beginPath();
    ctx.moveTo(X(-44), Y(4)); ctx.lineTo(X(-44), Y(80)); ctx.lineTo(X(-36), Y(86)); ctx.lineTo(X(-26), Y(86));
    ctx.lineTo(X(-26), Y(92)); ctx.lineTo(X(-14), Y(92)); ctx.lineTo(X(-14), Y(97)); ctx.lineTo(X(14), Y(97)); ctx.lineTo(X(14), Y(92));
    ctx.lineTo(X(26), Y(92)); ctx.lineTo(X(26), Y(86)); ctx.lineTo(X(36), Y(86));
    ctx.lineTo(X(44), Y(80)); ctx.lineTo(X(44), Y(4)); ctx.closePath(); ctx.fill();
    // ribs and a side shade
    ctx.fillStyle = 'rgba(255,220,180,.10)';
    for (const rx of [-42, -38.5, 37, 40.5]) ctx.fillRect(X(rx), Y(80), 1.5 * k, 76 * k);
    // flat-shaded planes: a warm lower facet, a lit left edge, a shaded right side
    ctx.fillStyle = '#8A2374';
    ctx.beginPath(); ctx.moveTo(X(-44), Y(4)); ctx.lineTo(X(44), Y(4)); ctx.lineTo(X(44), Y(26)); ctx.lineTo(X(-44), Y(56)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,160,.12)';
    ctx.beginPath(); ctx.moveTo(X(-44), Y(4)); ctx.lineTo(X(-44), Y(80)); ctx.lineTo(X(-20), Y(80)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(10,5,40,.3)';
    ctx.beginPath(); ctx.moveTo(X(44), Y(4)); ctx.lineTo(X(44), Y(80)); ctx.lineTo(X(36), Y(86)); ctx.lineTo(X(14), Y(86)); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#FFB31A';

    const fx0 = cx - dr * 0.16, fy0 = dcy - dr * 0.22;

      const a0 = g0 + i * TAU / 12, a1 = a0 + TAU / 12, sh = Math.cos((a0 + a1) / 2 + 2.2);

      ctx.beginPath(); ctx.moveTo(fx0, fy0);
      ctx.lineTo(cx + Math.cos(a0) * dr * 0.85, dcy + Math.sin(a0) * dr * 0.85); ctx.lineTo(cx + Math.cos(a1) * dr * 0.85, dcy + Math.sin(a1) * dr * 0.85);

    const secIdx = finaleOn ? -1 : (60 - bd.s) % 60;

      ctx.font = `900 ${dr * 0.56 * pulse}px "Big Shoulders Display", Impact, sans-serif`;
      ctx.fillText('Today', cx, dcy + dr * 0.12);
      ctx.fillStyle = '#B0236B';

      ctx.fillText(String(n), cx, dcy + dr * 0.35 * sc);

      const vals = [bd.mo, bd.d, bd.h, bd.m, bd.s];

        ctx.fillStyle = '#1A1150';
        ctx.font = `800 ${dr * 0.3}px "Big Shoulders Display", Impact, sans-serif`;
        ctx.fillText(pad(vals[i]), x, dcy + dr * 0.07);
        ctx.fillStyle = '#B0236B';
        ctx.font = `700 ${dr * 0.062}px "Bricolage Grotesque", system-ui, sans-serif`;
        ctx.fillText(NAMES[i][vals[i] === 1 ? 0 : 1], x, dcy + dr * 0.2);

      ctx.font = `700 ${dr * 0.078}px "Bricolage Grotesque", system-ui, sans-serif`;
      ctx.fillText('until 9 November 2027', cx, dcy + dr * 0.43);

  /* ---------------------------------------------------------------
     Main loop
     --------------------------------------------------------------- */
  const $ = id => document.getElementById(id);
  const finaleBtn = $('finaleBtn'), replayBtn = $('replayBtn'), soundBtn = $('soundBtn');
  const finaleText = $('finaleText'), finaleSub = $('finaleSub'), hud = $('hud');
  const routeText = $('routeText'), routeFill = $('routeFill'), live = $('live');
  const hudNum = ['hMo', 'hD', 'hH', 'hM', 'hS'].map($), hudLab = ['lMo', 'lD', 'lH', 'lM', 'lS'].map($);
  const hudLast = [-1, -1, -1, -1, -1];

  let nextLaunch = 0, nextRing = 0, lastRoute = '', lastLive = 0, lastPct = '';
  let last = performance.now(), prevCamZ = null, slow = 0;
  const items = [];

  function startFinale() {
    finaleOn = true; finaleT = T; rushing = false;
    flash = reduce ? 0.25 : 1;
    for (let i = 0; i < (reduce ? 4 : 14); i++) launch(i % 2 ? 'front' : 'back');
    addConfetti(reduce ? 60 : 320, true);
    rings.push({ life: 0 }, { life: -0.25 }, { life: -0.5 });
    crash();
    hud.hidden = true;
    finaleText.hidden = false;
    finaleText.classList.remove('show'); void finaleText.offsetWidth; finaleText.classList.add('show');
    if (mode === 'preview') {
      finaleSub.textContent = 'This is a preview. The real party starts at midnight on 9 November 2027.';
      replayBtn.hidden = false;
    } else {
      finaleSub.textContent = 'The parade made it to the clock.';
      finaleBtn.hidden = true;
    }
    live.textContent = 'Zero. It is 9 November 2027. Fireworks and music fill the sky.';
  }

  function backToToday() {
    mode = 'live'; finaleOn = false; rushing = false; lastTickSec = -1;
    finaleText.hidden = true; finaleText.classList.remove('show');
    hud.hidden = false;
    replayBtn.hidden = true;
    finaleBtn.textContent = 'Skip to the finale';
    rockets.length = 0; sparks.length = 0; glows.length = 0; rings.length = 0; confetti.length = 0;
    lastLive = 0; prevCamZ = null;
  }

  function startPreview() {
    if (finaleOn && mode === 'live') return;
    backToToday();
    mode = 'preview'; pv0 = performance.now(); pvFrom = realNow(); rushing = true;
    finaleBtn.textContent = 'Back to today';
    if (!A.on) setSound(true);
    whoosh();
  }

  function setSound(on) {
    if (on && !audioInit()) return;
    A.on = on;
    if (A.ac) {
      A.master.gain.cancelScheduledValues(A.ac.currentTime);
      A.master.gain.setTargetAtTime(on ? 0.75 : 0, A.ac.currentTime, 0.05);
      A.next = A.ac.currentTime + 0.05;
    }
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.textContent = on ? 'Turn sound off' : 'Turn sound on';
  }

  finaleBtn.addEventListener('click', () => { mode === 'preview' ? backToToday() : startPreview(); });
  replayBtn.addEventListener('click', startPreview);
  soundBtn.addEventListener('click', () => setSound(!A.on));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && mode === 'preview') backToToday(); });

  function drawSparks(layer) {
    ctx.globalCompositeOperation = 'lighter';
    for (const g of glows) {
      if (g.layer !== layer) continue;
      glow(GLK[g.k], g.x, g.y, g.r, (1 - g.life / 0.8) * 0.5);
    }
    ctx.lineCap = 'round';

      ctx.strokeStyle = s.c; ctx.lineWidth = s.w;

    }
    for (const r of rockets) {
      if (r.layer !== layer) continue;
      ctx.globalAlpha = 0.9; ctx.strokeStyle = '#FFE2A8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * 0.05, r.y - r.vy * 0.05); ctx.stroke();
      glow(GL.white, r.x, r.y, 8, 0.9);
    }

  }

  function frame(now) {
    const rawDt = (now - last) / 1000;
    const dt = Math.min(0.05, rawDt); last = now; T += dt;

    // if the device is struggling, trade sharpness and distance for smoothness
    if (rawDt > 0.034 && rawDt < 0.5) slow++; else slow = Math.max(0, slow - 2);
    if (slow > 90) {
      slow = 0;
      if (maxDPR > 1 && DPR > 1) { maxDPR = 1; resize(); }
      else if (quality > 0.5) quality -= 0.25;
    }

    const sim = simNow(now);
    const bd = breakdown(sim);
    if (bd.rem <= 0 && !finaleOn) startFinale();
    rushing = mode === 'preview' && !finaleOn;

    if (!finaleOn && bd.rem <= 10000 && bd.rem > 0) {
      const sec = Math.ceil(bd.rem / 1000);
      if (sec !== lastTickSec) { lastTickSec = sec; tick(sec); }
    }

    const p = clamp((sim - START) / (TARGET - START), 0, 1);
    dist = D0 + (D1 - D0) * p;
    camZ = ZC - dist;
    camSpeed = prevCamZ === null || dt <= 0 ? 0 : (camZ - prevCamZ) / dt;
    prevCamZ = camZ;
    HZ = H * (0.44 - 0.10 * p) + (YC - CAMH) * F / dist;
    drift += dt * (finaleOn ? 0.25 : 0.85);   // the column keeps marching past you

    // top-of-screen countdown
    const vals = [bd.mo, bd.d, bd.h, bd.m, bd.s];
    for (let i = 0; i < 5; i++) if (vals[i] !== hudLast[i]) {
      hudLast[i] = vals[i]; hudNum[i].textContent = pad(vals[i]); hudLab[i].textContent = NAMES[i][vals[i] === 1 ? 0 : 1];
    }
    const day = clamp(Math.floor((sim - START) / 864e5) + 1, 1, TOTAL_DAYS);
    const rt = rushing ? 'Fast-forwarding along the route' : `Day ${day} of ${TOTAL_DAYS} on the parade route`;
    if (rt !== lastRoute) { lastRoute = rt; routeText.textContent = rt; }
    const pct = (p * 100).toFixed(1) + '%';
    if (pct !== lastPct) { lastPct = pct; routeFill.style.width = pct; }

    if (!finaleOn && mode === 'live' && now - lastLive > 60000) {
      lastLive = now;
      const parts = [[bd.mo, 'month'], [bd.d, 'day'], [bd.h, 'hour'], [bd.m, 'minute']].map(([v, n]) => `${v} ${n}${v === 1 ? '' : 's'}`);
      live.textContent = `${parts.slice(0, -1).join(', ')} and ${parts[3]} until 9 November 2027.`;
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!reduce) {
      let sx = 0, sy = 0;
      if (finaleOn) { const s = Math.max(0, 1 - (T - finaleT) / 1.5) * 10; sx = (Math.random() - 0.5) * s; sy = (Math.random() - 0.5) * s; }
      // a gentle sway from the float you are riding, stronger at speed
      const ride = 1 + Math.min(4, Math.abs(camSpeed) / 12);
      ctx.translate(sx + Math.sin(T * 1.3) * 1.2 * ride, sy + Math.sin(T * 2.6) * 1.0 * ride);
    }

    /* sky */
    ctx.fillStyle = '#0B0729'; ctx.fillRect(-30, -30, W + 60, HZ + 30);
    drawMesh(SKY, -30, 0, W + 60, HZ);
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,244,224,${0.35 + 0.35 * Math.sin(T * 1.7 + s.ph)})`;
      ctx.fillRect(s.x * W, s.y * HZ, s.r, s.r);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const c of clouds) {
      const x = ((c.x + T * c.sp) % 1.4 - 0.2) * W, w = c.w * W;
      ctx.globalAlpha = 0.16;
      ctx.drawImage([GL.mag, GL.violet, GL.warm][c.k], x - w, c.y * HZ - w * 0.16, w * 2, w * 0.32);
    }
    for (const l of lanterns) {
      const y = ((l.y - T * l.sp) % 1 + 1) % 1, x = (l.x + Math.sin(T * 0.3 + l.ph) * 0.01) * W;
      const a = Math.sin(y * Math.PI);
      glow(GL.warm, x, y * HZ, 9 * l.s, a * 0.8);
      glow(GL.white, x, y * HZ, 2.2 * l.s, a);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    /* fireworks update */
    const fwEvery = finaleOn ? (reduce ? 0.7 : 0.16) : (rushing ? 0.45 : (reduce ? 3.2 : 1.3));
    if (T > nextLaunch) {
      launch(finaleOn && R() < 0.5 ? 'front' : 'back');
      if (!finaleOn && !reduce && R() < 0.2) { launch('back'); launch('back'); }
      nextLaunch = T + fwEvery * (0.5 + R());
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += r.g * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      if (r.vy >= -20) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life > s.max) {
        if (s.crackle && sparks.length < SPARK_CAP) { s.crackle = false; s.max += 0.15; s.c = '#FFFFFF'; s.w = 3; continue; }
        sparks.splice(i, 1); continue;
      }
      s.px = s.x; s.py = s.y;
      const dr = Math.exp(-s.drag * dt);
      s.vx *= dr; s.vy = s.vy * dr + s.g * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
    for (let i = glows.length - 1; i >= 0; i--) { glows[i].life += dt; if (glows[i].life > 0.8) glows.splice(i, 1); }
    drawSparks('back');

    /* searchlights from the tower */
    const tk = (F / dist) * TS, tgy = HZ + CAMH * F / dist;
    const beams = finaleOn ? 6 : 2;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < beams; i++) {
      const ox = W / 2 + (i % 2 ? 1 : -1) * (i < 2 ? 60 : i < 4 ? 30 : 46) * tk, oy = tgy - (i < 2 ? 34 : i < 4 ? 86 : 46) * tk;
      const ang = -Math.PI / 2 + Math.sin(T * (0.35 + i * 0.12) + i * 1.7) * 0.75;
      const len = H * 1.6, wd = 0.06;
      const gr = ctx.createLinearGradient(ox, oy, ox + Math.cos(ang) * len, oy + Math.sin(ang) * len);
      gr.addColorStop(0, finaleOn ? 'rgba(255,230,170,.30)' : 'rgba(255,230,170,.12)'); gr.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(ang - wd) * len, oy + Math.sin(ang - wd) * len);
      ctx.lineTo(ox + Math.cos(ang + wd) * len, oy + Math.sin(ang + wd) * len);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    /* distant skyline */
    ctx.fillStyle = '#3A1766';
    for (const b of skyline) ctx.fillRect(b.x * W, HZ - b.h * H * 0.035, b.w * W + 1, b.h * H * 0.035 + 1);

    /* ground, road, reflections */
    ctx.fillStyle = '#190D38'; ctx.fillRect(-30, HZ, W + 60, H - HZ + 30);
    drawMesh(GND, -30, HZ, W + 60, H - HZ + 30);
    const band = 6;
    for (let z = Math.floor((camZ + 0.4) / band) * band; z < ZC; z += band) {
      const z0 = Math.max(z, camZ + 0.4), z1 = z + band;
      const a = P(-ROADW, 0, z0), b = P(ROADW, 0, z0), c = P(ROADW, 0, z1), d = P(-ROADW, 0, z1);
      if (!a || !c) continue;
      ctx.fillStyle = fogc((z / band) % 2 ? [70, 36, 110] : [58, 29, 96], fogOf(z0 - camZ));
      quad(a, b, c, d);
    }
    // kerb lines and centre dashes
    ctx.strokeStyle = 'rgba(255,244,224,.28)'; ctx.lineWidth = 1.5;
    for (let sd = -1; sd <= 1; sd += 2) {
      const a = P(sd * ROADW, 0, camZ + 1), b = P(sd * ROADW, 0, ZC - 20);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,179,26,.5)';
    for (let z = Math.ceil((camZ + 1.5) / 8) * 8; z < camZ + 260; z += 8) {
      const a = P(-0.18, 0, z), b = P(0.18, 0, z), c = P(0.18, 0, z + 3.2), d = P(-0.18, 0, z + 3.2);
      if (a) quad(a, b, c, d);
    }
    // wet-street glow: the tower and each lamp smear down the asphalt
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = finaleOn ? 0.55 : 0.4;
    ctx.drawImage(finaleOn ? GL.gold : GL.mag, W / 2 - H * 0.45, HZ - H * 0.05, H * 0.9, (H - HZ) * 1.5);
    for (const l of lamps) {
      const dz = l.z - camZ;
      if (dz < 1.5 || dz > 220) continue;
      const q = P(l.x * 0.84, 0, l.z), k = q[2];
      ctx.globalAlpha = 0.34 * (1 - dz / 240);
      ctx.drawImage(GL.warm, q[0] - 1.5 * k, q[1] - 0.6 * k, 3 * k, 6 * k);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    for (const sp of specks) {
      const dz = sp.z - camZ;
      if (dz < 1 || dz > 150) continue;
      const q = P(sp.x, 0, sp.z), s = Math.max(0.8, 0.14 * q[2]);
      ctx.fillStyle = sp.c; ctx.globalAlpha = 0.75 - dz / 220;
      ctx.fillRect(q[0] - s, q[1] - s * 0.3, s * 2, s * 0.6);
    }
    ctx.globalAlpha = 1;

    /* tower */
    const tw = drawTower(bd, bd.rem);

    if (finaleOn && T > nextRing) { rings.push({ life: 0 }); nextRing = T + (reduce ? 6 : 3.75); }
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i]; rg.life += dt;
      if (rg.life < 0) continue;
      if (rg.life > 1.4) { rings.splice(i, 1); continue; }
      const k = rg.life / 1.4;
      ctx.strokeStyle = CONFETTI[i % 6]; ctx.globalAlpha = 1 - k;
      ctx.lineWidth = tw.dr * 0.06 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(tw.cx, tw.dcy, tw.dr * (1 + k * 2.2), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* far crowd: the column stretches all the way to the foot of the tower */
    const farFrom = 205 * quality + 10;
    for (let z = Math.ceil((camZ + farFrom) / 7) * 7; z < ZC - 14; z += 7) {
      const dz = z - camZ, k = F / dz, y = HZ + CAMH * k, f = fogOf(dz);
      const al = clamp((dz - farFrom) / 25, 0, 1);
      const idx = Math.round(z / 7);
      for (let j = 0; j < 16; j++) {
        const h1 = hash(idx * 17 + j);
        const x = W / 2 + (((j + h1) / 16) * 2 - 1) * (ROADW - 0.5) * k;
        const bob = Math.abs(Math.sin(T * 4 + h1 * 30)) * 0.25 * k;
        ctx.fillStyle = fogc(COSTUME[(idx + j * 5) % 6], f, al);
        ctx.fillRect(x - 0.22 * k, y - 1.75 * k - bob, Math.max(1.2, 0.44 * k), 1.75 * k);
      }
    }
    // far spectators as a soft band behind the barriers
    for (let sd = -1; sd <= 1; sd += 2) {
      for (let z = Math.max(0, Math.ceil((camZ + 80) / 12) * 12); z < END_Z; z += 12) {
        const a = P(sd * 14.5, 0, z), b = P(sd * 14.5, 1.7, z), c = P(sd * 14.5, 1.7, z + 12), d = P(sd * 14.5, 0, z + 12);
        if (!a) continue;
        ctx.fillStyle = fogc(COSTUME[Math.round(z / 12) % 5], Math.min(0.9, fogOf(a[3]) + 0.45));
        quad(a, b, c, d);
      }
    }

    /* buildings sit behind everything in the street */
    for (let i = buildings.length - 1; i >= 0; i--) { const b = buildings[i]; if (b.z1 > camZ + 0.35 && b.z0 - camZ < 640) drawBuilding(b); }

    /* depth-sorted street */
    items.length = 0;
    const maxInd = Math.min(LOOP - 8, dist - 12, 225 * quality + 10);
    for (const l of lamps) { const dz = l.z - camZ; if (dz > 0.6 && dz < 420) items.push({ z: dz, t: 0, o: l }); }
    for (const g of garlands) { const dz = g.z0 + 7 - camZ; if (dz > -6 && dz < 170 * quality) items.push({ z: dz, t: 1, o: g }); }
    for (const m of people) { const dz = wrap(m.wz); if (dz > 0.7 && dz < maxInd) items.push({ z: dz, t: 2, o: m }); }
    for (const fl of floats) { const dz = wrap(fl.wz); if (dz > 0.7 && dz < maxInd) items.push({ z: dz + 2.5, t: 3, o: fl, d: dz }); }
    for (const b of balloons) { const dz = wrap(b.wz); if (dz > 1.5 && dz < maxInd) items.push({ z: dz, t: 4, o: b }); }
    for (const dg of dragons) {
      const base = wrap(dg.wz);
      for (let i = 0; i < DRAGON_N; i++) { const dz = base + i * 0.95; if (dz > 0.8 && dz < maxInd) items.push({ z: dz, t: 5, o: dg, i }); }
    }
    const specEnd = Math.min(camZ + 82 * quality, END_Z);
    for (let i = Math.ceil((camZ + 1) / 1.25); i * 1.25 < specEnd; i++) {
      if (i < 0) continue;
      const dz = i * 1.25 - camZ;
      items.push({ z: dz + 0.05, t: 6, i, row: 1 }); items.push({ z: dz, t: 6, i, row: 0 });
    }
    items.sort((a, b) => b.z - a.z);
    for (const it of items) {
      const dz = it.z;
      if (it.t === 2) {
        const q = P(it.o.x, 0, camZ + dz);
        if (!q) continue;
        const al = clamp((maxInd - dz) / 30, 0, 1);
        if (al < 1) ctx.globalAlpha = al;
        drawPerson(it.o, q[0], q[1], q[2], fogOf(dz));
        if (al < 1) ctx.globalAlpha = 1;
      } else if (it.t === 6) { drawSpectator(it.i, it.row, -1, it.i * 1.25); drawSpectator(it.i + 5000, it.row, 1, it.i * 1.25); }
      else if (it.t === 0) drawLamp(it.o);
      else if (it.t === 1) drawGarland(it.o);
      else if (it.t === 3) drawFloat(it.o, camZ + it.d, fogOf(it.d));
      else if (it.t === 4) drawBalloon(it.o, camZ + dz, fogOf(dz));
      else drawDragonSeg(it.o, it.i, camZ + dz, fogOf(dz));
    }
    // barrier rails
    ctx.strokeStyle = 'rgba(255,244,224,.4)'; ctx.lineWidth = 1.5;
    for (let sd = -1; sd <= 1; sd += 2) {
      const a = P(sd * 13.4, 1.05, camZ + 0.6), b = P(sd * 13.4, 1.05, Math.max(camZ + 1, END_Z));
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }

    drawSparks('front');

    /* confetti: it streams past you when you pick up speed */
    const want = Math.round((finaleOn ? (reduce ? 70 : 340) : rushing ? (reduce ? 40 : 200) : (reduce ? 20 : 80)) * quality);
    if (confetti.length < want) addConfetti(Math.min(8, want - confetti.length), false);
    const grav = H * 0.9, push = reduce ? 0 : Math.min(2.2, Math.abs(camSpeed) / 28);
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy = Math.min(c.vy + grav * dt, 90 + (c.w % 3) * 15);
      c.vx *= Math.exp(-1.6 * dt);
      c.x += (c.vx + Math.sin(T * c.fr + c.ph) * 35 + (c.x - W / 2) * push) * dt;
      c.y += (c.vy + (c.y - HZ * 0.7) * push) * dt;
      c.rot += c.vr * dt;
      if (c.y > H + 30 || c.x < -60 || c.x > W + 60) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.scale(Math.cos(T * c.fr + c.ph), 1);
      ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }

    ctx.drawImage(vignette, -30, -30, W + 60, H + 60);

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,244,224,${flash * 0.6})`;
      ctx.fillRect(-30, -30, W + 60, H + 60);
      flash = Math.max(0, flash - dt * 1.4);
    }

    requestAnimationFrame(frame);
  }

  if (document.fonts && document.fonts.load) {
    document.fonts.load('800 40px "Big Shoulders Display"');
    document.fonts.load('700 20px "Bricolage Grotesque"');
  }
  requestAnimationFrame(frame);

  // If the real moment has already passed, the celebration just keeps going.
  if (realNow() >= TARGET) finaleBtn.hidden = true;
})();
</script>
</body>
</html>
